<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>矿洞地牢 修复版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{background:#1E1825;display:flex;justify-content:center;align-items:center;font-family:'Georgia',serif}
canvas{position:fixed;top:0;left:0;z-index:1;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;transition:opacity .5s;padding:20px;background:rgba(20,14,26,.92)}
.hid{display:none!important;opacity:0;pointer-events:none}

#ss{background:radial-gradient(ellipse at 50% 40%,#2E2238 0%,#1E1825 70%)}
.tt{font-size:clamp(1.8em,6vw,3.2em);color:#F0E6D3;text-shadow:0 0 30px rgba(255,200,100,.4),0 4px 8px rgba(0,0,0,.6);margin-bottom:6px;letter-spacing:3px;text-align:center}
.st{font-size:clamp(.85em,2.5vw,1.1em);color:#A89478;margin-bottom:24px;letter-spacing:1px;text-align:center}
.bn{font-family:inherit;font-size:clamp(.95em,2.5vw,1.2em);padding:14px 40px;border:3px solid #C9A96E;border-radius:12px;background:linear-gradient(180deg,#5C4A3A,#3D3228);color:#F0E6D3;cursor:pointer;letter-spacing:2px;transition:all .15s;text-shadow:0 1px 3px rgba(0,0,0,.5);box-shadow:0 4px 15px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);-webkit-tap-highlight-color:transparent}
.bn:hover{background:linear-gradient(180deg,#6B5845,#4A3C2E)}
.bn:active{transform:scale(.94);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.inf{color:#8B7355;font-size:clamp(.72em,1.8vw,.82em);margin-top:18px;text-align:center;line-height:1.9;letter-spacing:1px;max-width:380px}
.dt,.wt{font-size:clamp(1.6em,5vw,2.8em);margin-bottom:8px;text-shadow:0 0 20px rgba(0,0,0,.5)}
.dt{color:#C44040}.wt{color:#FFD700}
.sa{color:#A89478;font-size:clamp(.85em,2vw,1em);margin-bottom:22px;text-align:center;line-height:2}
.ui-bar{position:fixed;top:6px;right:10px;display:flex;gap:10px;z-index:50;transition:opacity .5s}
@media(max-width:768px){.ui-bar{top:44px;right:5px;gap:4px}.ubtn{padding:6px 10px;font-size:14px;border-width:1.5px;border-radius:7px}}
.ubtn{background:rgba(30,24,36,.85);border:1.5px solid #C9A96E;border-radius:6px;padding:5px 8px;font-size:14px;cursor:pointer;color:#FFF;box-shadow:0 1.5px 4px rgba(0,0,0,.5);transition:all .1s;-webkit-tap-highlight-color:transparent}
.ubtn:active{transform:scale(.9)}
.pan-c{background:rgba(30,24,36,.95);border:3px solid #5C4A3A;border-radius:12px;width:95%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;color:#F0E6D3;position:relative}
.cls{position:absolute;top:10px;right:15px;font-size:24px;cursor:pointer;color:#C9A96E}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;margin-top:10px}
.itm{background:#3D3228;border:1px solid #7A6548;border-radius:8px;padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:all .1s}
.itm:active{background:#5A4528}
.itm.eq{border-color:#FFD700;background:#4A3C2E;box-shadow:inset 0 0 10px rgba(255,215,0,.1)}
.itm .pr{color:#FFD700;font-size:.95em;margin-top:8px;font-weight:bold}
.itm .btn{background:#C9A96E;color:#1E1825;border:none;padding:6px;margin-top:10px;border-radius:4px;font-weight:bold;cursor:pointer}
.msg{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,14,26,.95);border:1px solid #C9A96E;color:#F0E6D3;padding:10px 20px;border-radius:8px;z-index:200;transition:opacity .3s;box-shadow:0 4px 10px rgba(0,0,0,.5)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="ui-bar hid" id="uib">
  <div class="ubtn" onclick="togglePan('pan_inv');playSound('hit')">🎒背包</div>
  <div class="ubtn" onclick="togglePan('pan_shop');playSound('hit')">🛒商店</div>
  <div class="ubtn" onclick="togglePan('pan_set');renderSet();playSound('hit')">⚙设置</div>
</div>

<div id="msg" class="msg hid"></div>

<div class="ov hid" id="pan_inv">
   <div class="pan-c">
      <div class="cls" onclick="togglePan('pan_inv')">✖</div>
      <h3 style="margin-bottom:10px;text-align:center;color:#C9A96E;font-size:1.4em">我的背包</h3>
      <div id="inv-list"></div>
   </div>
</div>

<div class="ov hid" id="pan_shop">
   <div class="pan-c">
      <div class="cls" onclick="togglePan('pan_shop')">✖</div>
      <h3 style="margin-bottom:10px;text-align:center;color:#C9A96E;font-size:1.4em">旅行商人</h3>
      <div style="text-align:center;color:#FFD700;margin-bottom:10px;font-weight:bold">拥有的金币: <span id="shop-g"></span></div>
      <div id="shop-list"></div>
   </div>
</div>

<div class="ov hid" id="pan_set">
   <div class="pan-c">
      <div class="cls" onclick="togglePan('pan_set')">✖</div>
      <h3 style="margin-bottom:15px;text-align:center;color:#C9A96E;font-size:1.4em">⚙ 设置</h3>
      <div class="st">📦 存档管理</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-bottom:20px">
        <button class="bn" style="font-size:.85em;padding:10px 24px" onclick="saveData();showMsg('✅ 存档已保存!');playSound('buy')">💾 保存游戏</button>
        <button class="bn" style="font-size:.85em;padding:10px 24px" onclick="loadLocal();showMsg('📂 读档完成!');playSound('buy')">📂 读取存档</button>
      </div>
      <div class="st">👤 外貌与性别</div>
      <div id="gender-opts" style="display:flex;gap:12px;justify-content:center;margin-bottom:8px"></div>
   </div>
</div>

<div class="ov" id="ss">
  <div class="tt">矿洞地牢</div>
  <div class="st">深入矿井，击败怪物，找到出口</div>

  <button class="bn" id="bs" type="button" onclick="startNewGame()">🆕 新游戏</button>

  <button class="bn" style="margin-top:12px;" id="btn_continue" type="button" onclick="continueGame()">▶️ 继续游戏</button>

  <button class="bn" style="margin-top:12px;background:linear-gradient(180deg,#4A6B8C,#2D4A6B);border-color:#6B9ACC;" type="button" onclick="showMultiplayerLobby()">👥 双人合作</button>

  <div class="inf" style="margin-top:30px">
    <span id="txt_pc">操作：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 | <kbd>空格</kbd> 攻击</span>
    <span id="txt_mob" style="display:none">操作：左侧摇杆移动 | 右侧按钮攻击</span><br>
    <span style="display:block;margin-top:8px;color:#C9A96E;">📖 说明：击败敌人收集金币，购买武器与时装，到达每层金色楼梯即可深入矿井。死亡后保留等级与装备，可继续挑战！</span>
    <br>
    <span style="color:#8B7355;">云端存档需部署平台后可用</span>
  </div>
</div>

<div class="ov hid" id="mp_lobby">
  <div class="pan-c" style="max-height:90vh">
    <h3 style="margin-bottom:15px;text-align:center;color:#6B9ACC;font-size:1.5em">👥 双人合作模式</h3>
    <div style="display:flex;gap:10px;justify-content:center;margin-bottom:20px">
      <button class="bn" style="font-size:.9em;padding:12px 28px" onclick="createRoom()">🏠 创建房间</button>
      <button class="bn" style="font-size:.9em;padding:12px 28px;background:linear-gradient(180deg,#4A6B8C,#2D4A6B);border-color:#6B9ACC;" onclick="joinRandomRoom()">🔍 快速加入</button>
    </div>
    <div class="st">📋 房间列表</div>
    <div id="room-list" style="max-height:300px;overflow-y:auto;margin-bottom:15px"></div>
    <div id="room-info" class="hid" style="background:#3D3228;border:1px solid #7A6548;border-radius:8px;padding:15px;margin-top:10px">
      <div style="text-align:center;color:#F0E6D3;margin-bottom:10px">
        <b>房间号:</b> <span id="room-id-display" style="color:#FFD700;font-size:1.2em"></span>
      </div>
      <div style="text-align:center;color:#A89478;margin-bottom:15px">
        等待队友加入...<br>
        <span id="partner-status" style="color:#6BBF6B">● 等待中</span>
      </div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="bn" style="font-size:.85em;padding:10px 24px" onclick="startMultiplayerGame()">⚔ 开始游戏</button>
        <button class="bn" style="font-size:.85em;padding:10px 24px;background:linear-gradient(180deg,#8B4040,#5C2020);border-color:#C06060;" onclick="leaveRoom()">❌ 离开房间</button>
      </div>
    </div>
    <button class="bn" style="font-size:.85em;margin-top:15px;padding:8px 20px;background:transparent;border-color:#666;color:#888" onclick="hideMultiplayerLobby()">← 返回主菜单</button>
  </div>
</div>
<div class="ov hid" id="ds">
  <div class="dt">你倒下了</div>
  <div class="sa" id="dsa"></div>
  <button class="bn" id="br" type="button">再次挑战</button>
</div>
<div class="ov hid" id="ws">
  <div class="wt">成功逃脱</div>
  <div class="sa" id="wsa"></div>
  <button class="bn" id="bw" type="button">再来一次</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
  import { getDatabase, ref, set, get, push, onValue, onChildAdded, onChildChanged, onChildRemoved, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

  window._fb = { ready: false, save: async()=>{}, load: async()=>{} };
  window._multiplayer = {
    db: null,
    roomId: null,
    playerId: null,
    isHost: false,
    partnerId: null,
    inRoom: false,
    listeners: []
  };

  var fbConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
  const appId = typeof __app_id !== 'undefined' ? __app_id : 'dungeon-multiplayer';

  if (!fbConfigStr) {
    fbConfigStr = JSON.stringify({
      apiKey: "AIzaSyDQlZEzIAnYvgq68g4x5ggXdt5FpwtB1U4",
      authDomain: "dungeon-multiplayer.firebaseapp.com",
      databaseURL: "https://dungeon-multiplayer-default-rtdb.firebaseio.com",
      projectId: "dungeon-multiplayer",
      storageBucket: "dungeon-multiplayer.appspot.com",
      messagingSenderId: "768544329683",
      appId: "1:768544329683:web:a57e63b7796da42974e926"
    });
  }

  if (fbConfigStr) {
    try {
      const firebaseConfig = JSON.parse(fbConfigStr);
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const rtdb = getDatabase(app);

      const initAuth = async () => {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      };
      await initAuth();

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          window._fb.userId = user.uid;
          window._fb.ready = true;
          window._fb.save = async (data) => {
             const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'gamedata', 'save');
             try { await setDoc(docRef, data); } catch(e){}
          };
          window._fb.load = async () => {
             const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'gamedata', 'save');
             try {
               const docSnap = await getDoc(docRef);
               return docSnap.exists() ? docSnap.data() : null;
             } catch(e){ return null; }
          };
          window._multiplayer.db = rtdb;
          
          var tempPlayerId = sessionStorage.getItem('dungeon_temp_player_id');
          if(!tempPlayerId) {
            tempPlayerId = 'player_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            sessionStorage.setItem('dungeon_temp_player_id', tempPlayerId);
          }
          window._multiplayer.playerId = tempPlayerId;
          window._multiplayer.firebaseUid = user.uid;

          window.fbRef = ref;
          window.fbSet = set;
          window.fbGet = get;
          window.fbPush = push;
          window.fbOnValue = onValue;
          window.fbUpdate = update;
          window.fbRemove = remove;
          window.fbServerTimestamp = serverTimestamp;

          console.log('✅ Firebase 已就绪!');
          console.log('🔑 玩家ID:', tempPlayerId);
          console.log('🔑 Firebase UID:', user.uid);
          const d = await window._fb.load();
          if(d && window.applySave) window.applySave(d);

          window.initMultiplayerFunctions = function() {
            window.createRoom = async function() {
              try {
                var mp = window._multiplayer;
                if(!mp.db) {
                  showMsg('❌ 数据库未连接,请刷新页面');
                  return;
                }

                showMsg('🔄 正在创建房间...');
                var roomId = 'room_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                console.log('创建房间:', roomId);

                mp.roomId = roomId;
                mp.isHost = true;
                mp.inRoom = true;

                var roomRef = ref(mp.db, 'dungeon_rooms/' + roomId);
                
                var retryCount = 0;
                var maxRetries = 3;
                var created = false;

                while(retryCount < maxRetries && !created) {
                  try {
                    await set(roomRef, {
                      id: roomId,
                      hostId: mp.playerId,
                      hostName: '玩家1',
                      guestId: null,
                      status: 'waiting',
                      createdAt: serverTimestamp()
                    });
                    created = true;
                    console.log('✅ 房间创建成功');
                  } catch(setError) {
                    retryCount++;
                    console.warn('创建失败,重试', retryCount, '/', maxRetries, ':', setError.message);
                    if(retryCount < maxRetries) {
                      await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                  }
                }

                if(!created) {
                  showMsg('❌ 创建房间失败,请检查网络');
                  mp.roomId = null; mp.isHost = false; mp.inRoom = false;
                  return;
                }

                document.getElementById('room-list').classList.add('hid');
                document.getElementById('room-info').classList.remove('hid');
                document.getElementById('room-id-display').innerText = roomId;

                console.log('✅ UI切换完成 - 房间信息应该显示');
                console.log('DEBUG: room-info element:', document.getElementById('room-info'));
                console.log('DEBUG: room-list element:', document.getElementById('room-list'));

                window.listenForPartner();
                showMsg('✅ 房间已创建! 房间号: ' + roomId);
                playSound('buy');

              } catch(error) {
                console.error('❌ createRoom 错误:', error);
                showMsg('❌ 创建失败: ' + error.message);
                var mp = window._multiplayer;
                mp.roomId = null; mp.isHost = false; mp.inRoom = false;
              }
            };

            window.joinRandomRoom = async function() {
              var mp = window._multiplayer;
              var roomsRef = ref(mp.db, 'dungeon_rooms');
              const snapshot = await get(roomsRef);
              const rooms = snapshot.val();

              if(!rooms){ showMsg('❌ 没有可加入的房间'); return; }

              var availableRooms = Object.values(rooms).filter(r => r.status === 'waiting' && r.guestId === null && r.hostId !== mp.playerId);

              if(availableRooms.length === 0){ showMsg('❌ 没有可加入的房间'); return; }

              await window.joinRoom(availableRooms[0].id);
            };

            window.joinRoom = async function(roomId) {
              try {
                var mp = window._multiplayer;
                if(!mp.db) {
                  showMsg('❌ 数据库未连接,请刷新页面');
                  return;
                }

                showMsg('🔄 正在加入房间...');
                console.log('加入房间:', roomId);

                mp.roomId = roomId;
                mp.isHost = false;
                mp.inRoom = true;

                var roomRef = ref(mp.db, 'dungeon_rooms/' + roomId);

                var retryCount = 0;
                var maxRetries = 3;
                var joined = false;

                while(retryCount < maxRetries && !joined) {
                  try {
                    await update(roomRef, { guestId: mp.playerId, guestName: '玩家2', status: 'playing' });
                    joined = true;
                    console.log('✅ 房间更新成功,尝试', retryCount + 1);
                  } catch(updateError) {
                    retryCount++;
                    console.warn('更新失败,重试', retryCount, '/', maxRetries, ':', updateError.message);
                    if(retryCount < maxRetries) {
                      await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                  }
                }

                if(!joined) {
                  showMsg('❌ 加入房间失败,请检查网络');
                  mp.roomId = null; mp.isHost = false; mp.inRoom = false;
                  return;
                }

                var roomData = null;
                retryCount = 0;
                while(retryCount < maxRetries && !roomData) {
                  try {
                    const snapshot = await get(roomRef);
                    roomData = snapshot.val();
                    if(roomData) {
                      console.log('✅ 获取房间数据成功');
                    }
                  } catch(getError) {
                    retryCount++;
                    console.warn('获取房间数据失败,重试:', getError.message);
                    if(retryCount < maxRetries) {
                      await new Promise(resolve => setTimeout(resolve, 500));
                    }
                  }
                }

                if(!roomData || !roomData.hostId) {
                  showMsg('❌ 房间数据无效');
                  return;
                }

                mp.partnerId = roomData.hostId;

                document.getElementById('room-list').classList.add('hid');
                document.getElementById('room-info').classList.remove('hid');
                document.getElementById('room-id-display').innerText = roomId;
                document.getElementById('partner-status').innerText = '● 已连接';
                document.getElementById('partner-status').style.color = '#4CAF50';

                window.notifyHost();
                showMsg('✅ 成功加入房间! 房主ID: ' + mp.partnerId.substr(0,8) + '...');
                playSound('buy');

              } catch(error) {
                console.error('❌ joinRoom 错误:', error);
                showMsg('❌ 加入失败: ' + error.message);
                var mp = window._multiplayer;
                mp.roomId = null; mp.isHost = false; mp.partnerId = null; mp.inRoom = false;
              }
            };

            window.leaveRoom = function() {
              var mp = window._multiplayer;
              if(mp.roomId && mp.db){
                var roomRef = ref(mp.db, 'dungeon_rooms/' + mp.roomId);
                if(mp.isHost){ remove(roomRef); }
                else { update(roomRef, { guestId: null, status: 'waiting' }); }
              }
              mp.roomId = null; mp.isHost = false; mp.partnerId = null; mp.inRoom = false;
              document.getElementById('room-list').classList.remove('hid');
              document.getElementById('room-info').classList.add('hid');
            };

            window.listenForPartner = function() {
              var mp = window._multiplayer;
              var roomRef = ref(mp.db, 'dungeon_rooms/' + mp.roomId);
              var listener = onValue(roomRef, async (snapshot) => {
                var data = snapshot.val();
                if(data && data.guestId && data.guestId !== mp.playerId){
                  mp.partnerId = data.guestId;
                  document.getElementById('partner-status').innerText = '● 队友已连接';
                  document.getElementById('partner-status').style.color = '#4CAF50';
                  playSound('buy');
                }
              });
            };

            window.notifyHost = function() {
              var mp = window._multiplayer;
              var playerRef = ref(mp.db, 'dungeon_rooms/' + mp.roomId + '/guestId');
              set(playerRef, mp.playerId);
            };

            window.refreshRoomList = async function() {
              var mp = window._multiplayer;
              if(!mp.db) return;
              var roomsRef = ref(mp.db, 'dungeon_rooms');
              const snapshot = await get(roomsRef);
              const rooms = snapshot.val();

              var html = '';
              if(!rooms || Object.keys(rooms).length === 0){
                html = '<div style="text-align:center;color:#888;padding:20px">暂无房间,创建一个吧!</div>';
              } else {
                for(var key in rooms){
                  var r = rooms[key];
                  if(r.status === 'waiting'){
                    html += `<div class="itm" onclick="joinRoom('${r.id}')"><b>房间 ${r.id.substr(-6)}</b><br><span style="font-size:0.85em;color:#A89478">房主: ${r.hostName} | 等待中...</span></div>`;
                  }
                }
              }
              document.getElementById('room-list').innerHTML = html;
            };

            window.startMultiplayerGame = async function() {
              var mp = window._multiplayer;
              if(!mp.isHost && !mp.partnerId){ showMsg('⚠️ 等待房主开始游戏...'); return; }

              isMultiplayer = true;
              P2 = {x:0,y:0,dir:'down',hp:6,mhp:6,atk:1,mv:false,atkg:false,atkt:0,invt:0,wf:0,pSpd:1};

              initAudio(); rstP(); initFl(1); gs='playing';
              document.getElementById('mp_lobby').classList.add('hid');
              document.getElementById('ds').classList.add('hid');
              document.getElementById('ws').classList.add('hid');
              document.getElementById('uib').classList.remove('hid');

              if(mp.isHost){ P2.x = P.x + T*2; P2.y = P.y; }

              setInterval(async () => {
                if(gs !== 'playing' || !isMultiplayer) return;
                try{
                  var myStateRef = ref(mp.db, 'dungeon_rooms/' + mp.roomId + '/players/' + mp.playerId);
                  await set(myStateRef, {
                    x: P.x, y: P.y, dir: P.dir, hp: P.hp, mhp: P.mhp,
                    atk: P.atk, lv: P.lv, fl: P.fl, atkg: P.atkg, atkd: P.atkd,
                    eqWep: DB.eqWep, eqSkin: DB.eqSkin, gender: DB.gender
                  });

                  if(mp.isHost){
                    var monstersRef = ref(mp.db, 'dungeon_rooms/' + mp.roomId + '/monsters');
                    var monsData = mons.filter(m => m.hp > 0).map(m => ({
                      id: m.id, type: m.type, x: m.x, y: m.y, hp: m.hp, mhp: m.mhp
                    }));
                    await set(monstersRef, monsData);
                  }

                  if(mp.partnerId){
                    var partnerRef = ref(mp.db, 'dungeon_rooms/' + mp.roomId + '/players/' + mp.partnerId);
                    onValue(partnerRef, (snapshot) => {
                      var data = snapshot.val();
                      if(data && P2){
                        var oldX = P2.x, oldY = P2.y;
                        P2.x = data.x || P2.x; P2.y = data.y || P2.y;
                        P2.dir = data.dir || 'down'; P2.hp = data.hp || P2.hp;
                        P2.mhp = data.mhp || P2.mhp; P2.atk = data.atk || 1;
                        P2.atkg = data.atkg || false; P2.atkd = data.atkd || 'down';
                        P2.pSpd = SKINS[data.eqSkin]?.spd || 1; P2.eqWep = data.eqWep;
                        if(P2.x !== oldX || P2.y !== oldY){ P2.mv = true; P2.wf = (P2.wf||0)+1; } else { P2.mv = false; }
                      }
                    }, {onlyOnce: false});
                  }
                }catch(e){}
              }, 50);

              showMsg('🎮 双人合作模式已启动!');
            };

            console.log('✅ 联机函数已初始化!');
          };

          window.initMultiplayerFunctions();
        }
      });
    } catch(e) { console.error("Firebase err:", e); }
  }
</script>

<script>

function startNewGame(){
  initAudio(); rstP();

  document.getElementById('ds').classList.add('hid');
  document.getElementById('ws').classList.add('hid');
  document.getElementById('uib').classList.remove('hid');
  if(window._multiplayer.inRoom){
    leaveRoom();
  }
}

function continueGame(){
  var saved = loadLocal();
  if (saved) {
    initAudio(); rstP();
    applySave(saved);
    initFl(saved.fl || 1);
    gs='playing'; isMultiplayer=false; P2=null;
    document.getElementById('ss').classList.add('hid');
    document.getElementById('ds').classList.add('hid');
    document.getElementById('ws').classList.add('hid');
    document.getElementById('uib').classList.remove('hid');
    if(window._multiplayer.inRoom){
      leaveRoom();
    }
  } else {
    showMsg('❌ 没有找到存档，请先开始新游戏！');
  }
}

function startSinglePlayer(){
  continueGame();
}

var mpRetryCount = 0;
var mpMaxRetries = 10;

async function waitForFirebase(){
  for(var i = 0; i < mpMaxRetries; i++){
    if(window._fb.ready && window._multiplayer.db){
      return true;
    }
    await new Promise(resolve => setTimeout(resolve, 500));
    mpRetryCount++;
  }
  return false;
}

async function showMultiplayerLobby(){
  var btn = event.target;
  if(btn) btn.disabled = true;
  showMsg('🔄 正在连接服务器...');

  var isReady = await waitForFirebase();

  if(btn) btn.disabled = false;

  if(!isReady || !window._fb.ready || !window._multiplayer.db){
    showMsg('❌ 联机功能需要部署到平台后才能使用<br>当前模式: 单人游戏');
    console.warn('Multiplayer: Firebase not ready', {
      fbReady: window._fb.ready,
      dbExists: !!window._multiplayer.db,
      configExists: typeof __firebase_config !== 'undefined',
      retries: mpRetryCount
    });
    return;
  }

  document.getElementById('ss').classList.add('hid');
  document.getElementById('mp_lobby').classList.remove('hid');
  refreshRoomList();
  showMsg('✅ 已连接到联机服务器');
}

  document.getElementById('mp_lobby').classList.add('hid');

}

function playSound(type){
  if(!actx) return;
  try {
    var osc = actx.createOscillator(), gain = actx.createGain(), t = actx.currentTime;
    osc.connect(gain); gain.connect(actx.destination);
    if(type==='hit'){ osc.type='square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t+0.1); gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.1); osc.start(t); osc.stop(t+0.1); }
    else if(type==='coin'){ osc.type='sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.setValueAtTime(1200, t+0.05); gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.1); osc.start(t); osc.stop(t+0.1); }
    else if(type==='atk'){ osc.type='triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(100, t+0.05); gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0.01, t+0.05); osc.start(t); osc.stop(t+0.05); }
    else if(type==='hurt'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.2); gain.gain.setValueAtTime(0.6, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.2); osc.start(t); osc.stop(t+0.2); }
    else if(type==='buy'){ osc.type='sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.setValueAtTime(600, t+0.1); osc.frequency.setValueAtTime(1000, t+0.2); gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.3); osc.start(t); osc.stop(t+0.3); }
    else if(type==='xp'){ osc.type='sine'; osc.frequency.setValueAtTime(520, t); osc.frequency.setValueAtTime(780, t+0.06); osc.frequency.setValueAtTime(1040, t+0.12); gain.gain.setValueAtTime(0.25, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.15); osc.start(t); osc.stop(t+0.15); }
    else if(type==='lvlup'){ osc.type='sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(900, t+0.15); osc.frequency.linearRampToValueAtTime(1200, t+0.3); gain.gain.setValueAtTime(0.35, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.4); osc.start(t); osc.stop(t+0.4); }

}

function onTouchStart(e){
  if(e.target.closest('.ov') || e.target.closest('.ui-bar') || e.target.closest('.msg')) return;
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i], tx=t.clientX, ty=t.clientY;
    if(!atkBtn.on && Math.hypot(tx-abx, ty-aby) < ABR+20){
      atkBtn.on=true; atkBtn.id=t.identifier; atkBtn.pressed=true; keys['Space']=true;
    } else if(!joy.on && tx < W*0.55){
      joy.on=true; joy.id=t.identifier;
      joy.bx=tx; joy.by=ty; joy.kx=tx; joy.ky=ty; joy.dx=0; joy.dy=0;
    }
  }
}
function onTouchMove(e){
  if(e.target.closest('.ov') || e.target.closest('.ui-bar') || e.target.closest('.msg')) return;
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(joy.on && t.identifier===joy.id){
      var dx=t.clientX-joy.bx, dy=t.clientY-joy.by, d=Math.hypot(dx,dy);
      if(d>JR){dx=dx/d*JR; dy=dy/d*JR;}
      joy.kx=joy.bx+dx; joy.ky=joy.by+dy; joy.dx=dx/JR; joy.dy=dy/JR;
    }
  }
}
function onTouchEnd(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(joy.on && t.identifier===joy.id){ joy.on=false; joy.id=-1; joy.dx=0; joy.dy=0; keys['KeyW']=keys['KeyS']=keys['KeyA']=keys['KeyD']=false; }
    if(atkBtn.on && t.identifier===atkBtn.id){ atkBtn.on=false; atkBtn.id=-1; atkBtn.pressed=false; keys['Space']=false; }
  }
}

/* ===== 工具 ===== */
function rn(a,b){return Math.random()*(b-a)+a;}
function ri(a,b){return Math.floor(rn(a,b+1));}
function pk(a){return a[ri(0,a.length-1)];}
function cl(v,l,h){return Math.max(l,Math.min(h,v));}
function lr(a,b,t){return a+(b-a)*t;}

/* ===== 投射物专用墙壁碰撞检测（修复法杖失效问题）===== */
function isWProj(px, py, map){
  var tx = Math.floor(px / T);
  var ty = Math.floor(py / T);
  if(tx < 0 || tx >= MW || ty < 0 || ty >= MH) return true;
  return map.tiles[ty][tx] === 0;
}

/* ===== 地图生成 ===== */
var MAP_STYLES = ['classic','maze','cross','spiral','cave','arena'];
function getMapStyle(floor){
  if(floor<=2) return 'classic';
  if(floor<=4) return pk(['classic','maze']);
  if(floor<=7) return pk(['maze','cross','cave']);
  if(floor<=10) return pk(['cross','spiral','arena']);
  return pk(['spiral','arena','cave','maze']);
}
function genMap(floor){
  var style = getMapStyle(floor);
  curMapStyle = style;
  var rawMap;
  try {
    switch(style){
      case 'maze': rawMap = genMazeMap(floor); break;
      case 'cross': rawMap = genCrossMap(floor); break;
      case 'spiral': rawMap = genSpiralMap(floor); break;
      case 'cave': rawMap = genCaveMap(floor); break;
      case 'arena': rawMap = genArenaMap(floor); break;
      default: rawMap = genClassicMap(floor);
    }
    if (!rawMap || !rawMap.tiles || !rawMap.rooms || rawMap.rooms.length === 0 || !rawMap.sr) {
      throw new Error("生成的房间无效");
    }
  } catch(e) {
    console.warn("地图生成降级: ", e);
    rawMap = genClassicMap(floor);
    if (!rawMap || !rawMap.rooms || rawMap.rooms.length === 0) {
      rawMap = genClassicMap(1);
    }
  }
  return rawMap;
}
function genClassicMap(floor){
  var tiles=[], rooms=[], decor=[];
  for(var y=0;y<MH;y++){tiles[y]=new Uint8Array(MW);}
  var nr=cl(8+floor,8,16);
  for(var at=0; at<250 && rooms.length<nr; at++){
    var rw=ri(5,9), rh=ri(5,8), rx=ri(2,MW-rw-2), ry=ri(2,MH-rh-2), ok=true;
    for(var j=0;j<rooms.length;j++){ var r=rooms[j]; if(rx<r.x+r.w+2 && rx+rw+2>r.x && ry<r.y+r.h+2 && ry+rh+2>r.y){ok=false;break;} }
    if(!ok) continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)});
    for(var y=ry;y<ry+rh;y++) for(var x=rx;x<rx+rw;x++) tiles[y][x]=1;
  }
  linkRooms(tiles,rooms);
  return finishMap(tiles,rooms,decor,floor);
}
function genMazeMap(floor){
  var tiles=[], rooms=[], decor=[];
  for(var y=0;y<MH;y++){tiles[y]=new Uint8Array(MW);}
  var nr=cl(6+Math.floor(floor*.6),5,12);
  for(var at=0; at<200 && rooms.length<nr; at++){
    var rw=ri(3,6), rh=ri(3,5), rx=ri(1,MW-rw-1), ry=ri(1,MH-rh-1), ok=true;
    for(var j=0;j<rooms.length;j++){ var r=rooms[j]; if(rx<r.x+r.w+1&&rx+rw+1>r.x&&ry<r.y+r.h+1&&ry+rh+1>r.y){ok=false;break;} }
    if(!ok) continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)});
    for(var y=ry;y<ry+rh;y++) for(var x=rx;x<rx+rw;x++) tiles[y][x]=1;
  }
  linkRooms(tiles,rooms);
  addWindingPaths(tiles,rooms,ri(15,30));
  return finishMap(tiles,rooms,decor,floor);
}
function genCrossMap(floor){
  var tiles=[], rooms=[], decor=[];
  for(var y=0;y<MH;y++){tiles[y]=new Uint8Array(MW);}
  var cx=Math.floor(MW/2), cy=Math.floor(MH/2);
  var hw=ri(7,10), hh=ri(6,9);
  rooms.push({x:cx-hw,y:cy-hh,w:hw*2,h:hh*2,cx:cx,cy:cy});
  for(var y=cy-hh;y<cy+hh;y++) for(var x=cx-hw;x<cx+hw;x++) tiles[y][x]=1;
  var arms=[{dx:hw+2,dy:0,w:ri(4,7),h:ri(4,6)},{dx:-hw-2,dy:0,w:ri(4,7),h:ri(4,6)},
            {dx:0,dy:hh+2,w:ri(4,6),h:ri(4,7)},{dx:0,dy:-hh-2,w:ri(4,6),h:ri(4,7)}];
  arms.forEach(function(a){
    var ax=cx+a.dx-Math.floor(a.w/2), ay=cy+a.dy-Math.floor(a.h/2);
    ax=cl(ax,1,MW-a.w-1); ay=cl(ay,1,MH-a.h-1);
    rooms.push({x:ax,y:ay,w:a.w,h:a.h,cx:Math.floor(ax+a.w/2),cy:Math.floor(ay+a.h/2)});
    for(var y=ay;y<ay+a.h;y++) for(var x=ax;x<ax+a.w;x++) tiles[y][x]=1;
    var sx=cx, sy=cy, ex=rooms[rooms.length-1].cx, ey=rooms[rooms.length-1].cy;
    while(sx!==ex){if(sy>=0&&sy<MH&&sx>=0&&sx<MW)tiles[sy][sx]=1;sx+=sx<ex?1:-1;}
    while(sy!==ey){if(sy>=0&&sy<MH&&sx>=0&&sx<MW)tiles[sy][sx]=1;sy+=sy<ey?1:-1;}
  });
  var extraRi=ri(2,5);
  for(var e=0;e<extraRi;e++){
    var erw=ri(3,5), erh=ri(3,5), erx=ri(2,MW-erw-2), ery=ri(2,MH-erh-2);
    var overlap=false;
    for(var j=0;j<rooms.length;j++){var r=rooms[j];if(erx<r.x+r.w+1&&erx+erw+1>r.x&&ery<r.y+r.h+1&&ery+erh+1>r.y){overlap=true;break;}}
    if(!overlap){
      rooms.push({x:erx,y:ery,w:erw,h:erh,cx:Math.floor(erx+erw/2),cy:Math.floor(ery+erh/2)});
      for(var y=ery;y<ery+erh;y++) for(var x=erx;x<erx+erw;x++) tiles[y][x]=1;
      var nr=rooms[rooms.length-1], target=pk(rooms.slice(0,-1));
      connectTwo(tiles,nr,target);
    }
  }
  return finishMap(tiles,rooms,decor,floor);
}
function genSpiralMap(floor){
  var tiles=[], rooms=[], decor=[];
  for(var y=0;y<MH;y++){tiles[y]=new Uint8Array(MW);}
  var cx=Math.floor(MW/2), cy=Math.floor(MH/2);
  var spiral=[];
  var dir=0, dx=[1,0,-1,0], dy=[0,1,0,-1];
  var px=cx-2, py=cy-2, stepLen=3, maxStep=20, turns=0;
  for(var s=0;s<maxStep;s++){
    var w=ri(2,4), h=ri(2,3);

      else if(d==='left') cx.fillRect(px-s*.1,py+s*.42,s*.35,s*.12);
      else cx.fillRect(px+s*.7,py+s*.42,s*.35,s*.12);
    } else { cx.fillRect(px+s*.12,py+s*.42,s*.12,s*.22); cx.fillRect(px+s*.76,py+s*.42,s*.12,s*.22); }
    cx.fillStyle=CC.ps; cx.fillRect(px+s*.2,py+s*.05,s*.6,s*.36);
    cx.fillStyle=skin.c; cx.fillRect(px+s*.15,py,s*.7,s*.20);
    if(DB.eqSkin==='s_shd'){
      cx.fillStyle='#111'; cx.fillRect(px+s*.15,py,s*.7,s*.08);
    } else if(DB.eqSkin==='s_nin'){
      cx.fillStyle='#1A1A1A'; cx.fillRect(px+s*.2,py+s*.04,s*.6,s*.06);
      cx.fillStyle='#3A3A3A'; cx.fillRect(px+s*.3,py+s*.08,s*.4,s*.03);
    } else if(DB.eqSkin==='s_mag'){
      cx.fillStyle='#6B4FA0'; cx.fillRect(px+s*.1,py-s*.02,s*.8,s*.06);
      cx.fillStyle='rgba(180,150,220,.6)'; cx.fillRect(px+s*.2,py+s*.02,s*.6,s*.03);
    } else if(DB.eqSkin==='s_drg'){
      cx.fillStyle='#2E5C2E'; cx.fillRect(px+s*.12,py-s*.02,s*.76,s*.07);
      for(var di=0;di<3;di++){ cx.fillStyle='rgba(80,160,80,.35)'; cx.fillRect(px+s*.18+di*s*.2,py-s*.01,s*.08,s*.04); }
    }
    var dr=P.dir;
    if(dr==='right') cx.fillRect(px+s*.15,py+s*.05,s*.12,s*.28);
    else if(dr==='left') cx.fillRect(px+s*.73,py+s*.05,s*.12,s*.28);
    else { cx.fillRect(px+s*.15,py+s*.05,s*.1,s*.2); cx.fillRect(px+s*.75,py+s*.05,s*.1,s*.2); }
    cx.fillStyle=CC.pe;
    if(dr==='down'){cx.fillRect(px+s*.33,py+s*.2,s*.08,s*.08);cx.fillRect(px+s*.58,py+s*.2,s*.08,s*.08);}
    else if(dr==='right') cx.fillRect(px+s*.25,py+s*.2,s*.08,s*.08);
    else if(dr==='left') cx.fillRect(px+s*.65,py+s*.2,s*.08,s*.08);
  }
  if(P.atkg && WEPS[DB.eqWep].tp!=='range') drSw(px,py,P.atkd,P.atkt);
  else if(!P.atkg) drWeaponHold(px,py,s);
  drCapeBehind(px,py,s);
  cx.restore();
  drCosmeticsFront(px,py,s);
}

function drCapeBehind(px, py, s) {
  var eq = DB.eqCostume;
  if (!eq || !eq.cape || eq.cape === 'c_none') return;
  var cp = COSTUMES.capes[eq.cape];
  if (!cp || !cp.color) return;
  var ccx = px + s/2, ccy = py + s/2;
  var time = Date.now() * 0.003;
  var capeColor = cp.color === 'rainbow' ? `hsl(${(time*50)%360},70%,55%)` : cp.color;
  cx.save();
  cx.globalAlpha *= 0.6;
  if(eq.cape==='c_angel' || eq.cape==='c_demon'){
    for(var wi=0;wi<3;wi++){
      var wa=Math.sin(time*2+wi*.8)*.35;
      var wingAlpha = .85-Math.abs(wa)*.3;
      cx.save(); cx.translate(ccx+(wi-1)*T*.15,ccy+T*.1); cx.rotate(wa-.6);
      cx.globalAlpha=wingAlpha; cx.fillStyle=capeColor;
      cx.beginPath(); cx.moveTo(0,0); cx.lineTo(-T*.18,-T*.35); cx.quadraticCurveTo(0,-T*.42,T*.18,-T*.35); cx.closePath(); cx.fill();
      if(eq.cape==='c_angel'){ cx.fillStyle='rgba(255,255,200,.4)'; cx.beginPath(); cx.moveTo(0,-T*.08); cx.lineTo(-T*.08,-T*.28); cx.lineTo(T*.08,-T*.28); cx.closePath(); cx.fill(); }
      else { cx.fillStyle='rgba(139,0,0,.4)'; cx.beginPath(); cx.moveTo(0,-T*.08); cx.lineTo(-T*.08,-T*.28); cx.lineTo(T*.08,-T*.28); cx.closePath(); cx.fill(); }
      cx.globalAlpha=wingAlpha*.5; cx.fillStyle=capeColor;
      cx.beginPath(); cx.moveTo(-T*.12,-T*.2); cx.quadraticCurveTo(0,-T*.32,T*.12,-T*.2); cx.closePath(); cx.fill();
      cx.restore();
    }
  } else {
    var mv = P.mv ? 1.6 : 1;
    var blowDir = (P.dir==='left')?1:(P.dir==='right')?-1:0;
    var wave1=Math.sin(time*2.5*mv)*3*mv, wave2=Math.sin(time*3.2*mv)*2.5*mv, wave3=Math.sin(time*1.8*mv)*2*mv;
    var blowX = blowDir * (P.mv?6:1.5);
    cx.fillStyle=capeColor; cx.globalAlpha=.95;
    cx.beginPath();
    cx.moveTo(ccx-T*.25+blowX*.3,ccy+T*.05);
    cx.quadraticCurveTo(ccx-T*.38-wave1+blowX,ccy+T*.3,ccx-T*.22+blowX*.7,ccy+T*.48);
    cx.quadraticCurveTo(ccx-T*.1-wave2+blowX*.85,ccy+T*.6,ccx+blowX,ccy+T*.62);
    cx.quadraticCurveTo(ccx+T*.1+wave2+blowX*.85,ccy+T*.6,ccx+T*.22-blowX*.7,ccy+T*.48);
    cx.quadraticCurveTo(ccx+T*.38+wave1-blowX,ccy+T*.3,ccx+T*.25-blowX*.3,ccy+T*.05);
    cx.closePath(); cx.fill();
    if(eq.cape==='c_fire'){
      for(var fci=0;fci<4;fci++){
        var fcA=.4+.3*Math.sin(time*6+fci*1.5);
        cx.globalAlpha=fcA; cx.fillStyle='#FF4500';
        var fcx=ccx+(Math.sin(time*4+fci*2)-.5)*T*.35+blowX*.6;
        var fcy=ccy+T*.25+fci*T*.09;
        cx.beginPath(); cx.arc(fcx,fcy,3+fci*.5,0,Math.PI*2); cx.fill();
        cx.fillStyle='#FFD700'; cx.globalAlpha=fcA*.5;
        cx.beginPath(); cx.arc(fcx,fcy-2,1.5,0,Math.PI*2); cx.fill();
      }
    }
    if(eq.cape==='c_shadow'){
      cx.globalAlpha=.15+.1*Math.sin(time*3); cx.fillStyle='#191970';
      cx.beginPath(); cx.ellipse(ccx+blowX*.5,ccy+T*.35,T*.38,T*.22,0,0,Math.PI*2); cx.fill();
    }
    cx.globalAlpha=.4; cx.fillStyle='#000';
    cx.beginPath();
    cx.moveTo(ccx-T*.22+blowX*.7,ccy+T*.48);
    cx.quadraticCurveTo(ccx-T*.1-wave3+blowX*.85,ccy+T*.56,ccx+blowX,ccy+T*.58);
    cx.quadraticCurveTo(ccx+T*.1+wave3+blowX*.85,ccy+T*.56,ccx+T*.22-blowX*.7,ccy+T*.48);
    cx.lineTo(ccx+T*.2-blowX*.65,ccy+T*.46);
    cx.quadraticCurveTo(ccx+T*.09+wave3*.5+blowX*.5,ccy+T*.54,ccx+blowX,ccy+T*.56);
    cx.quadraticCurveTo(ccx-T*.09-wave3*.5+blowX*.5,ccy+T*.54,ccx-T*.2+blowX*.65,ccy+T*.46);
    cx.closePath(); cx.fill();
    if(cp.color!=='rainbow'){
      cx.globalAlpha=.3; cx.fillStyle='rgba(255,255,255,.5)';
      cx.beginPath();
      cx.moveTo(ccx-T*.22+blowX*.7,ccy+T*.46);
      cx.quadraticCurveTo(ccx-T*.34-wave1*.7+blowX,ccy+T*.32,ccx-T*.2+blowX*.55,ccy+T*.44);
      cx.lineTo(ccx-T*.17+blowX*.45,ccy+T*.42);
      cx.quadraticCurveTo(ccx-T*.28-wave1*.5+blowX*.35,ccy+T*.29,ccx-T*.18+blowX*.5,ccy+T*.42);
      cx.lineTo(ccx-T*.22+blowX*.6,ccy+T*.42);
      cx.quadraticCurveTo(ccx-T*.32-wave1*.6+blowX*.4,ccy+T*.28,ccx-T*.16+blowX*.5,ccy+T*.44);
      cx.closePath(); cx.fill();
    }
    cx.globalAlpha=1;
  }
  cx.restore();
}

function drWeaponHold(px,py,s){
  var wep = WEPS[DB.eqWep];
  if(!wep) return;
  var ccx=px+s/2, ccy=py+s/2;
  var dir = P.dir;
  var time = Date.now()*.002;
  cx.save(); cx.translate(ccx,ccy);

  // 【剑尖朝向脸面对的方向，带自然倾斜】
  var angle = 0;
  // 剑倾斜30度，更自然
  var tilt = Math.PI / 6;
  if(dir==='down') angle = tilt;           // 朝下时，剑尖右下倾斜
  else if(dir==='up') angle = Math.PI - tilt;  // 朝上时，剑尖左上倾斜
  else if(dir==='left') angle = Math.PI/2 + tilt;  // 朝左时，剑尖左下倾斜
  else if(dir==='right') angle = -Math.PI/2 - tilt; // 朝右时，剑尖右上倾斜

  cx.rotate(angle);
  
  // 调整剑的位置，让护手贴近角色身体（向负Y方向偏移）
  cx.translate(0, -s * 0.25);

  if(wep.tp==='range'){
    drRangeWeaponHold(s, wep, time);
  } else {
    drMeleeWeaponHold(s, wep, time);
  }

  cx.restore();
}

function drRangeWeaponHold(s, wep, time){
  cx.translate(0,-s*.3);
  var wandBob = Math.sin(time*3)*2;

  if(wep.id==='w_wand'){
    cx.fillStyle='#4A3728'; cx.fillRect(-2-wandBob,s*.08,4,s*.48);
    cx.fillStyle=wep.c; cx.beginPath(); cx.arc(-wandBob,s*.06,5,0,Math.PI*2); cx.fill();
    cx.fillStyle='#9B6EB5'; cx.globalAlpha=.5; cx.beginPath(); cx.arc(-wandBob,s*.06,7,time*3,time*6); cx.stroke(); cx.globalAlpha=1;
  } else if(wep.id==='w_poison'){
    cx.fillStyle='#2F4F2F'; cx.fillRect(-2.5-wandBob,s*.08,5,s*.5);
    cx.fillStyle='#32CD32'; cx.beginPath(); cx.moveTo(-wandBob-4,s*.12); cx.quadraticCurveTo(-wandBob,s*0,-wandBob+4,s*.12); cx.quadraticCurveTo(-wandBob,s*.18,-wandBob,s*.12); cx.closePath(); cx.fill();
    cx.globalAlpha=.4+.3*Math.sin(time*4); cx.fillStyle='#00FF00';
    for(var pi=0;pi<3;pi++){ cx.beginPath(); cx.arc(-wandBob+Math.sin(time*5+pi)*3,s*.15+pi*4,2,0,Math.PI*2); cx.fill(); }
    cx.globalAlpha=1;
  } else if(wep.id==='w_ice'){
    cx.fillStyle='#4682B4'; cx.fillRect(-2-wandBob,s*.08,4,s*.48);
    cx.strokeStyle='#87CEEB'; cx.lineWidth=2;
    for(var ci=0;ci<4;ci++){ cx.beginPath(); cx.arc(-wandBob,s*.1,5+ci*2,time*2+ci,Math.PI*4); cx.stroke(); }
    cx.fillStyle='#E0FFFF'; cx.globalAlpha=.6; cx.beginPath(); cx.arc(-wandBob,s*.25,4,0,Math.PI*2); cx.fill(); cx.globalAlpha=1;
  } else if(wep.id==='w_storm'){
    cx.save();
    cx.translate(-s * 0.25, s * 0.08);
    cx.rotate(-0.15);
    cx.strokeStyle = '#5C3A1E';
    cx.lineWidth = 5;
    cx.beginPath();
    cx.moveTo(-s * 0.38, -s * 0.05);
    cx.quadraticCurveTo(-s * 0.3, -s * 0.25, 0, -s * 0.32);
    cx.quadraticCurveTo(s * 0.3, -s * 0.25, s * 0.38, -s * 0.05);
    cx.stroke();
    cx.strokeStyle = '#8B6914';
    cx.lineWidth = 3;
    cx.beginPath();
    cx.moveTo(-s * 0.36, -s * 0.05);
    cx.quadraticCurveTo(-s * 0.28, -s * 0.22, 0, -s * 0.28);
    cx.quadraticCurveTo(s * 0.28, -s * 0.22, s * 0.36, -s * 0.05);
    cx.stroke();
    cx.strokeStyle = '#C0A060';
    cx.lineWidth = 1.5;
    cx.beginPath();
    cx.moveTo(-s * 0.38, -s * 0.05);
    cx.lineTo(s * 0.38, -s * 0.05);
    cx.stroke();
    cx.fillStyle = '#3A2A1A';
    cx.fillRect(-s * 0.04, -s * 0.05, s * 0.08, s * 0.15);
    cx.strokeStyle = '#5C4A3A';
    cx.lineWidth = 1;
    for (var i = 0; i < 4; i++) {
      cx.beginPath();
      cx.moveTo(-s * 0.04, -s * 0.03 + i * 3);
      cx.lineTo(s * 0.04, -s * 0.05 + i * 3);
      cx.stroke();
    }
    cx.restore();
  } else if(wep.id==='w_fire'){
    cx.fillStyle='#8B2500'; cx.fillRect(-2.5-wandBob,s*.08,5,s*.45);
    var firePulse = .6 + .4 * Math.sin(time * 5);
    cx.globalAlpha = firePulse;
    var grad = cx.createRadialGradient(-wandBob, s*.15, 0, -wandBob, s*.15, 8);
    grad.addColorStop(0, '#FFFF00'); grad.addColorStop(0.5, '#FF4500'); grad.addColorStop(1, 'transparent');
    cx.fillStyle = grad;
    cx.beginPath(); cx.arc(-wandBob, s*.15, 8, 0, Math.PI * 2); cx.fill();
    cx.globalAlpha = 1;
  } else if(wep.id==='w_shadow'){
    cx.save();
    cx.translate(-s * 0.28, s * 0.1);
    cx.rotate(0.15);
    cx.strokeStyle = '#2D1B4E';
    cx.lineWidth = 4;
    cx.beginPath();
    cx.arc(0, 0, s * 0.36, Math.PI * -0.72, Math.PI * 0.72);
    cx.stroke();
    cx.strokeStyle = '#9370DB';
    cx.lineWidth = 1.5;
    cx.beginPath();
    cx.moveTo(-s * 0.35 * Math.cos(0.72), -s * 0.35 * Math.sin(0.72));
    cx.lineTo(s * 0.35 * Math.cos(0.72), s * 0.35 * Math.sin(0.72));
    cx.stroke();
    cx.fillStyle = '#1A1A1A';
    cx.fillRect(-2, s * 0.05, 4, s * 0.12);
    cx.restore();
  } else if(wep.id==='w_heal'){
    cx.fillStyle='#2E8B57'; cx.fillRect(-2-wandBob,s*.08,4,s*.48);
    cx.globalAlpha=.6+.4*Math.sin(time*3); cx.fillStyle='#98FB98';
    cx.beginPath(); cx.arc(-wandBob,s*.2,6,0,Math.PI*2); cx.fill();
    cx.fillStyle='#FFF'; cx.globalAlpha=.8; cx.beginPath(); cx.arc(-wandBob,s*.2,2,0,Math.PI*2); cx.fill(); cx.globalAlpha=1;
  } else if(wep.id==='w_multi'){
    cx.save();
    cx.translate(-s * 0.22, s * 0.05);
    cx.rotate(-0.1);
    cx.fillStyle = '#5C3A1E';
    cx.fillRect(-s * 0.48, -s * 0.02, s * 0.96, s * 0.1);
    cx.fillStyle = '#8B7355';
    cx.fillRect(-s * 0.5, -s * 0.02, s * 0.04, s * 0.1);
    cx.fillRect(s * 0.46, -s * 0.02, s * 0.04, s * 0.1);
    cx.strokeStyle = '#3A2A1A';
    cx.lineWidth = 1;
    cx.beginPath();
    cx.moveTo(-s * 0.48, 0);
    cx.lineTo(-s * 0.48, -s * 0.15);
    cx.stroke();
    cx.beginPath();
    cx.moveTo(s * 0.48, 0);
    cx.lineTo(s * 0.48, -s * 0.15);
    cx.stroke();
    cx.strokeStyle = '#8B6914';
    cx.lineWidth = 2;
    cx.beginPath();
    cx.moveTo(-s * 0.48, -s * 0.12);
    cx.lineTo(s * 0.48, -s * 0.12);
    cx.stroke();
    cx.fillStyle = '#4A3728';
    cx.fillRect(-s * 0.08, s * 0.05, s * 0.16, s * 0.4);
    cx.fillStyle = '#2A1A0A';
    cx.fillRect(s * 0.02, s * 0.3, s * 0.06, s * 0.08);
    cx.fillStyle = '#1A0A00';
    cx.fillRect(-s * 0.06, -s * 0.15, s * 0.12, s * 0.25);
    cx.fillStyle = '#FFD700';
    cx.fillRect(-s * 0.02, -s * 0.18, s * 0.04, s * 0.04);

  } else if(wep.id==='w_star'){
    cx.fillStyle='#4B0082'; cx.fillRect(-2-wandBob,s*.08,4,s*.48);
    cx.save(); cx.translate(-wandBob, s*.18); cx.rotate(time*2);
    cx.fillStyle='#9370DB'; cx.shadowColor='#DDA0DD'; cx.shadowBlur=6;
    drawStar(cx, 0, 0, 5, 7, 3.5);
    cx.shadowBlur=0; cx.restore();
  }
}

function drMeleeWeaponHold(s, wep, time){
  var wepLen = s*wep.r*.85;
  var breath = Math.sin(time*2)*.05;

  if(wep.id==='w_rusty'){
    // 细长生锈短剑
    var len = s * 0.9;
    var sw = 4;
    var bladeLen = len * 0.85;
    
    cx.rotate(breath);
    
    // 剑刃外轮廓
    cx.fillStyle = '#3D2D1D';
    cx.fillRect(-sw/2 - 0.5, -0.5, sw + 1, bladeLen + 1);
    
    // 剑刃 - 生锈颜色
    var bladeGrad = cx.createLinearGradient(-sw/2, 0, sw/2, 0);
    bladeGrad.addColorStop(0, '#4A3A2A');
    bladeGrad.addColorStop(0.3, '#6B5B4B');
    bladeGrad.addColorStop(0.5, '#7B6B5B');
    bladeGrad.addColorStop(0.7, '#6B5B4B');
    bladeGrad.addColorStop(1, '#4A3A2A');
    cx.fillStyle = bladeGrad;
    cx.fillRect(-sw/2, 0, sw, bladeLen);
    
    // 剑尖
    cx.fillStyle = '#7B6B5B';
    cx.beginPath();
    cx.moveTo(-sw/2, bladeLen);
    cx.lineTo(0, len + 10);
    cx.lineTo(sw/2, bladeLen);
    cx.closePath();
    cx.fill();
    
    // 生锈纹理
    cx.fillStyle = 'rgba(40,30,20,0.4)';
    cx.fillRect(-0.5, 6, 1, bladeLen*0.45);
    
    // 十字护手
    var guardY = len * 0.03;
    cx.fillStyle = '#3D2D1D';
    cx.fillRect(-sw*1.4, guardY-1, sw*2.8, 3);
    cx.fillStyle = '#5B4B3B';
    cx.fillRect(-sw*1.2, guardY-0.5, sw*2.4, 2);
    
    // 剑柄
    cx.fillStyle = '#2D1D0D';
    cx.fillRect(-sw*0.3, guardY+3, sw*0.6, len*0.12);
    // 纹理
    cx.fillStyle = '#3D2D1D';
    for(var ri=0; ri<2; ri++){
      cx.fillRect(-sw*0.3+0.5, guardY+5+ri*3, sw*0.6-1, 1);
    }
    
    // 圆头
    cx.fillStyle = '#3D2D1D';
    cx.beginPath();
    cx.arc(0, guardY+3+len*0.12+2, 2, 0, Math.PI*2);
    cx.fill();
  } else if(wep.id==='w_dagger'){
    // 匕首 - 向下绘制
    var dLen = s * 0.55;
    cx.fillStyle = '#7B68AE';
    cx.beginPath();
    cx.moveTo(-2, 0);
    cx.lineTo(0, dLen);
    cx.lineTo(2, 0);
    cx.closePath();
    cx.fill();
    cx.fillStyle = '#FFD700';
    cx.fillRect(-3, -2, 6, 4);
    cx.fillStyle = '#483D8B';
    cx.beginPath();
    cx.moveTo(-1, 2);
    cx.lineTo(0, dLen - 4);
    cx.lineTo(1, 2);
    cx.fill();
  } else if(wep.id==='w_iron'){
    // 精钢剑 - 向下绘制
    var len = s * 0.9;
    var sw = 5;
    cx.fillStyle = '#C0C0C0';
    cx.fillRect(-sw/2, 0, sw, len);
    cx.fillStyle = '#E8E8E8';
    cx.fillRect(-1, 4, 2, len - 12);
    cx.strokeStyle = '#909090';
    cx.lineWidth = 0.6;
    cx.beginPath();
    cx.moveTo(-2, 6);
    cx.lineTo(-2, len - 6);
    cx.stroke();
    cx.beginPath();
    cx.moveTo(2, 6);
    cx.lineTo(2, len - 6);
    cx.stroke();
    cx.fillStyle = '#8B6914';
    cx.fillRect(-4, -2, 8, 4);
    cx.fillStyle = '#FFD700';
    cx.fillRect(-3, -0.5, 6, 2);
  } else if(wep.id==='w_dual'){
    // 双子匕首 - 向下绘制
    var dualBreath = Math.sin(time * 4) * 4;
    cx.save(); cx.translate(-s * 0.15, dualBreath); cx.rotate(0.25 + breath);
    cx.fillStyle='#C0C0C0'; cx.beginPath(); cx.moveTo(0, -2); cx.lineTo(-2.5, s*.32); cx.lineTo(-0.8, s*.42); cx.lineTo(0.8, s*.42); cx.lineTo(2.5, s*.32); cx.closePath(); cx.fill();
    cx.fillStyle='#A0A0A0'; cx.fillRect(-1.5, s*.42, 3, 2.5); cx.restore();

    cx.save(); cx.translate(s * 0.15, -dualBreath); cx.rotate(-0.25 - breath);
    cx.fillStyle='#C0C0C0'; cx.beginPath(); cx.moveTo(0, -2); cx.lineTo(-2.5, s*.32); cx.lineTo(-0.8, s*.42); cx.lineTo(0.8, s*.42); cx.lineTo(2.5, s*.32); cx.closePath(); cx.fill();
    cx.fillStyle='#A0A0A0'; cx.fillRect(-1.5, s*.42, 3, 2.5); cx.restore();
  } else if(wep.id==='w_spear'){
    // 龙骑长矛 - 向下绘制
    cx.rotate(breath * 0.8);
    cx.fillStyle='#8B6914'; cx.fillRect(-2.5, 0, 5, wepLen);
    cx.fillStyle='#C0A060'; cx.beginPath(); cx.moveTo(0, wepLen-5); cx.lineTo(-9, wepLen*.82); cx.lineTo(0, wepLen+5); cx.lineTo(9, wepLen*.82); cx.closePath(); cx.fill();
    cx.fillStyle='#FFD700'; cx.fillRect(-2, wepLen*.85, 4, 5);
    cx.fillStyle='#A0522D'; cx.fillRect(-3, wepLen*.45, 6, 10);
  } else if(wep.id==='w_axe'){
    // 巨魔战斧 - 向下绘制
    var al = s * 0.95;

function drawSword(s, len, color, darkColor, effect, breath){
  // 细长剑身，不要太宽
  var sw = 4;
  var bladeLen = len * 0.9;

  cx.rotate(breath);

  // 剑刃外轮廓
  cx.fillStyle = '#777';
  cx.fillRect(-sw/2 - 0.5, -0.5, sw + 1, bladeLen + 1);

  // 剑刃主体 - 带渐变效果
  var bladeGrad = cx.createLinearGradient(-sw/2, 0, sw/2, 0);
  bladeGrad.addColorStop(0, '#C0C0C0');
  bladeGrad.addColorStop(0.3, '#E8E8E8');
  bladeGrad.addColorStop(0.5, '#F8F8F8');
  bladeGrad.addColorStop(0.7, '#E8E8E8');
  bladeGrad.addColorStop(1, '#C0C0C0');
  cx.fillStyle = bladeGrad;
  cx.fillRect(-sw/2, 0, sw, bladeLen);

  // 剑刃尖端 - 锋利的三角形
  cx.fillStyle = '#E0E0E0';
  cx.beginPath();
  cx.moveTo(-sw/2, bladeLen);
  cx.lineTo(0, len + 12);
  cx.lineTo(sw/2, bladeLen);
  cx.closePath();
  cx.fill();

  // 血槽
  cx.fillStyle = 'rgba(80,80,80,0.3)';
  cx.fillRect(-0.5, 8, 1, bladeLen * 0.5);

  // 剑刃高光
  cx.fillStyle = 'rgba(255,255,255,0.5)';
  cx.fillRect(-sw/2 + 0.5, 5, 1, bladeLen * 0.6);

  // 十字护手 - 适中大小
  var guardY = len * 0.08;
  cx.fillStyle = '#6B5333';
  cx.fillRect(-sw * 1.5, guardY - 1, sw * 3, 3);
  cx.fillStyle = '#D4AF37';
  cx.fillRect(-sw * 1.3, guardY - 0.5, sw * 2.6, 2);

  // 剑柄
  var handleH = len * 0.15;
  cx.fillStyle = '#4A3728';
  cx.fillRect(-sw * 0.35, guardY + 3, sw * 0.7, handleH);
  // 剑柄纹理
  cx.fillStyle = '#5C4838';
  for (var hi = 0; hi < 2; hi++) {
    cx.fillRect(-sw * 0.35 + 0.5, guardY + 5 + hi * 4, sw * 0.7 - 1, 1);
  }

  // 剑柄末端圆头
  cx.fillStyle = '#8B6914';
  cx.beginPath();
  cx.arc(0, guardY + 3 + handleH + 2, 2.5, 0, Math.PI * 2);
  cx.fill();

  if(effect){
    cx.globalAlpha=.7; cx.fillStyle=effect.c; cx.shadowColor=effect.c; cx.shadowBlur=effect.blur||6;
    cx.beginPath(); cx.ellipse(0, len*.4, sw*.4, len*.25, 0, 0, Math.PI*2); cx.fill();
    cx.shadowBlur=0; cx.globalAlpha=1;
  }
}

function shadeColor(c){
  if(c.startsWith('#')){
    var r=parseInt(c.slice(1,3),16), g=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16);
    return `rgba(${Math.floor(r*.7)},${Math.floor(g*.7)},${Math.floor(b*.7)},1)`;
  }
  return c.replace(/[^,]+(?=\))/, (m)=>'rgba(0,0,0,.2)');
}

        cx.fillStyle=`rgba(255,${100+hornGlow*155},0,${hornGlow})`; cx.beginPath(); cx.arc(s*.08,-s*.32,3,0,Math.PI*2); cx.fill(); cx.restore();

        cx.fillStyle='#FFB6C1'; cx.globalAlpha=.5; cx.beginPath(); cx.ellipse(ccx-s*.08,py-s*.04,s*.04,s*.03,0,0,Math.PI*2); cx.fill();
        cx.beginPath(); cx.ellipse(ccx+s*.08,py-s*.04,s*.04,s*.03,0,0,Math.PI*2); cx.fill(); cx.globalAlpha=1;

        for(var spi=0;spi<6;spi++){ var sa=spi*Math.PI/3+time*2; cx.beginPath(); cx.moveTo(ccx+Math.cos(sa)*8,py-s*.25+pomPomBob); cx.lineTo(ccx+Math.cos(sa)*14,py-s*.3+pomPomBob); cx.strokeStyle='#FFF'; cx.lineWidth=2; cx.stroke(); }
        cx.globalAlpha=1;
      } else if(eq.hat==='h_pirate'){
        cx.fillStyle=h.color; cx.fillRect(ccx-s*.24,py-s*.17,s*.48,s*.12);
        cx.fillStyle='#FFF'; cx.fillRect(ccx-s*.17,py-s*.23,s*.34,s*.08);
        cx.fillStyle='#000'; cx.globalAlpha=.3; cx.beginPath(); cx.arc(ccx-s*.08,py-s*.19,s*.03,0,Math.PI*2); cx.fill(); cx.beginPath(); cx.arc(ccx+.08,py-s*.19,s*.03,0,Math.PI*2); cx.fill(); cx.globalAlpha=1;
        cx.fillStyle='#FFF'; cx.globalAlpha=.8; cx.beginPath(); cx.moveTo(ccx,py-s*.23); cx.lineTo(ccx-s*.05,py-s*.13); cx.lineTo(ccx+.05,py-s*.13); cx.closePath(); cx.fill(); cx.globalAlpha=1;

  if(eq.effect && eq.effect!=='e_none'){

          var fa=time*4+fi*Math.PI/5;

          var grad=cx.createRadialGradient(ccx+Math.cos(fa)*fr,ccy+Math.sin(fa)*fr,0,ccx+Math.cos(fa)*fr,ccy+Math.sin(fa)*fr,6+Math.sin(time*7+fi)*3);
          grad.addColorStop(0,'#FFFF00'); grad.addColorStop(.5,'#FF4500'); grad.addColorStop(1,'transparent');

        cx.beginPath(); cx.arc(ccx,ccy,s*.25,0,Math.PI*2); cx.fill();
      } else if(ef.effect==='shadow'){
        cx.globalAlpha=.35; cx.fillStyle='#191970';
        cx.beginPath(); cx.ellipse(ccx,ccy+s*.35,s*.55,s*.35,0,0,Math.PI*2); cx.fill();
        for(var shi=0;shi<5;shi++){

        cx.globalAlpha=holyPulse; cx.strokeStyle='#FFD700'; cx.lineWidth=2.5;
        cx.beginPath(); cx.arc(ccx,ccy,s*.52+Math.sin(time)*s*.06,0,Math.PI*2); cx.stroke();
        cx.globalAlpha=holyPulse*.7; cx.lineWidth=1.5;
        cx.beginPath(); cx.arc(ccx,ccy,s*.38+Math.cos(time*1.5)*s*.04,0,Math.PI*2); cx.stroke();
        cx.globalAlpha=.3; cx.fillStyle='#FFD700';
        cx.beginPath(); cx.arc(ccx,ccy,s*.15,0,Math.PI*2); cx.fill();
        for(var hli=0;hli<6;hli++){
          var hla=hli*Math.PI/3+time;
          cx.globalAlpha=.5; cx.fillStyle='#FFD700';
          cx.beginPath(); cx.arc(ccx+Math.cos(hla)*s*.4,ccy+Math.sin(hla)*s*.4,2,0,Math.PI*2); cx.fill();
        }
      } else if(ef.effect==='poison'){
        for(var pi=0;pi<8;pi++){
          var pa=time*2.5+pi*Math.PI*2/8;
          var pr=s*.42+Math.sin(time*5+pi)*s*.08;
          var poisonAlpha=.4+.3*Math.sin(time*7+pi*2);
          cx.globalAlpha=poisonAlpha; cx.fillStyle='#32CD32';
          cx.beginPath(); cx.arc(ccx+Math.cos(pa)*pr,ccy+Math.sin(pa)*pr,2.5+Math.sin(time*8+pi),0,Math.PI*2); cx.fill();
        }
        cx.globalAlpha=.25; cx.fillStyle='#228B22';
        cx.beginPath(); cx.ellipse(ccx,ccy+s*.15,s*.5,s*.25,0,0,Math.PI*2); cx.fill();
      }
      cx.globalAlpha=1; cx.restore();
    }
  }
  if(eq.accessory && eq.accessory!=='a_none'){
    var ac=COSTUMES.accessories[eq.accessory];
    if(ac && ac.style){
      cx.save();
      cx.globalAlpha *= 0.65;
      if(ac.style==='glasses'){
        cx.strokeStyle='#333'; cx.lineWidth=2; cx.fillStyle='rgba(150,200,255,.2)';
        cx.beginPath(); cx.arc(ccx-s*.09,py+s*.19,s*.07,0,Math.PI*2); cx.fill(); cx.stroke();
        cx.beginPath(); cx.arc(ccx+s*.09,py+s*.19,s*.07,0,Math.PI*2); cx.fill(); cx.stroke();
        cx.strokeStyle='#333'; cx.lineWidth=1.5;
        cx.beginPath(); cx.moveTo(ccx-s*.02,py+s*.19); cx.lineTo(ccx+.02,py+s*.19); cx.stroke();
        cx.fillStyle='rgba(150,200,255,.1)'; cx.fillRect(ccx-s*.11,py+s*.14,s*.22,s*.1);
      } else if(ac.style==='mask'){
        cx.fillStyle='rgba(255,255,255,.85)';
        cx.beginPath(); cx.roundRect(ccx-s*.13,py+s*.11,s*.26,s*.12,3); cx.fill();
        cx.strokeStyle='rgba(200,200,200,.5)'; cx.lineWidth=1;
        cx.stroke();
        cx.fillStyle='rgba(0,0,0,.1)'; cx.fillRect(ccx-s*.08,py+s*.15,s*.16,s*.04);
      } else if(ac.style==='eyepatch'){
        var epOff = (P.dir==='right') ? -s*.16 : s*.0;
        var eDir = (P.dir==='left')?1:-1;
        cx.fillStyle='#222'; cx.fillRect(ccx+epOff,py+s*.13,s*.16,s*.1);
        cx.strokeStyle='#333'; cx.lineWidth=1.5;
        cx.beginPath(); cx.moveTo(ccx+epOff+s*.15,py+s*.11); cx.lineTo(ccx+epOff+s*.22,py+s*.04); cx.stroke();
        cx.strokeStyle='#8B4513'; cx.lineWidth=2;
        cx.beginPath(); cx.moveTo(ccx+epOff+s*.22,py+s+.04); cx.lineTo(ccx+epOff+s*.22+eDir*s*.09,py+s+.18); cx.stroke();
        cx.beginPath(); cx.moveTo(ccx+epOff+s*.22,py+s+.04); cx.lineTo(ccx+epOff+s*.22-eDir*s*.11,py+s+.16); cx.stroke();
      } else if(ac.style==='ribbon'){
        var ribbonWave=Math.sin(time*5)*1;
        cx.fillStyle='#FF69B4';
        cx.beginPath(); cx.moveTo(ccx-s*.12,py+s+.02+ribbonWave); cx.quadraticCurveTo(ccx,py-s*.1,ccx+s*.12,py+s+.02-ribbonWave); cx.quadraticCurveTo(ccx,py+s+.08,ccx-s*.12,py+s+.02+ribbonWave); cx.closePath(); cx.fill();
        cx.fillStyle='#FFB6C1'; cx.globalAlpha=.8;
        cx.beginPath(); cx.arc(ccx-s*.1,py+s+.01,4.5,0,Math.PI*2); cx.fill();
        cx.beginPath(); cx.arc(ccx+s*.1,py+s+.01,4.5,0,Math.PI*2); cx.fill();
        cx.globalAlpha=1;
        cx.strokeStyle='#FF1493'; cx.lineWidth=1;
        cx.beginPath(); cx.moveTo(ccx-s*.1,py+s+.01); cx.lineTo(ccx-s*.1-s*.03,py+s+.05); cx.stroke();
        cx.beginPath(); cx.moveTo(ccx+s*.1,py+s+.01); cx.lineTo(ccx+s*.1+s*.03,py+s+.05); cx.stroke();
      } else if(ac.style==='skull'){
        cx.fillStyle='#EEE'; cx.beginPath(); cx.arc(ccx,py+s+.4,s*.09,0,Math.PI*2); cx.fill();
        cx.fillStyle='#222';
        cx.beginPath(); cx.arc(ccx-s*.035,py+s+.38,s*.025,0,Math.PI*2); cx.fill();
        cx.beginPath(); cx.arc(ccx+s*.035,py+s+.38,s*.025,0,Math.PI*2); cx.fill();
        cx.strokeStyle='#222'; cx.lineWidth=1;
        cx.beginPath(); cx.moveTo(ccx-s*.03,py+s+.46); cx.lineTo(ccx-.01,py+s+.5); cx.lineTo(ccx+.01,py+s+.5); cx.lineTo(ccx+.03,py+s+.46); cx.stroke();
        cx.fillStyle='#8B0000'; cx.globalAlpha=.6;
        cx.beginPath(); cx.arc(ccx,py+s+.43,s*.015,0,Math.PI*2); cx.fill(); cx.globalAlpha=1;

        cx.fillStyle='#00CED1'; cx.globalAlpha=.9;
        cx.beginPath(); cx.arc(ringX,py+s+.57,2.5,0,Math.PI*2); cx.fill();

}
function drawStar(ctx,cx,cy,spikes,outerRadius,innerRadius){
  var rot=Math.PI/2*3,x=cx,y=cy,step=Math.PI/spikes;
  ctx.beginPath(); ctx.moveTo(cx,cy-outerRadius);
  for(var i=0;i<spikes;i++){
    x=cx+Math.cos(rot)*outerRadius; y=cy+Math.sin(rot)*outerRadius; ctx.lineTo(x,y); rot+=step;
    x=cx+Math.cos(rot)*innerRadius; y=cy+Math.sin(rot)*innerRadius; ctx.lineTo(x,y); rot+=step;
  }
  ctx.lineTo(cx,cy-outerRadius); ctx.closePath(); ctx.fill();
}

function drSw(px,py,d,prog){
  var ccx=px+T/2, ccy=py+T/2, wep=WEPS[DB.eqWep];
  cx.globalAlpha=cl(1-prog/15,0,1);
  cx.save(); cx.translate(ccx,ccy);
  // 【剑尖朝向脸面对的方向，带自然倾斜】
   var a=0;
   var tilt = Math.PI / 6;
   if(d==='down') a=tilt;           // 朝下时，剑尖右下倾斜
   else if(d==='up') a=Math.PI-tilt;  // 朝上时，剑尖左上倾斜
   else if(d==='left') a=Math.PI/2+tilt;  // 朝左时，剑尖左下倾斜
   else if(d==='right') a=-Math.PI/2-tilt; // 朝右时，剑尖右上倾斜
  a += Math.sin(prog*.5)*.8;
  cx.rotate(a);
  
  // 调整剑的位置，让护手贴近角色身体（向负Y方向偏移）
  cx.translate(0, -T * 0.25);

  var wepLen=T*1.2*wep.r;
  if(wep.tp==='range'){
    var wandWid=wep.atk>=3?6:(wep.atk>=2?5:4);
    cx.fillStyle='#4A3728'; cx.fillRect(-wandWid/2-2,-4,wandWid+4,8);
    cx.fillStyle=wep.c; cx.fillRect(-wandWid/2,-wepLen*.9,wandWid,wepLen);
    if(wep.projType==='fire'){ cx.globalAlpha=.7; cx.fillStyle='#FF4500'; cx.beginPath(); cx.arc(0,-wepLen*.85,8,0,Math.PI*2); cx.fill(); }
    else if(wep.projType==='ice'){ cx.strokeStyle='#87CEEB'; cx.lineWidth=2; for(var ci=0;ci<3;ci++){ cx.beginPath(); cx.arc(0,-wepLen*(.7+ci*.08),4+ci*2,0,Math.PI*2); cx.stroke(); } }
    else if(wep.projType==='poison'){ cx.fillStyle='#32CD32'; cx.beginPath(); cx.arc(0,-wepLen*.85,5,0,Math.PI*2); cx.fill(); }
    else if(wep.projType==='penetrate' || wep.id==='w_storm'){ cx.fillStyle='#FFE082'; cx.fillRect(-wandWid/2-2,-wepLen*.95,wandWid+4,6); }
    else if(wep.projType==='shadow'){ cx.globalAlpha=.4; cx.fillStyle='#191970'; cx.beginPath(); cx.arc(0,-wepLen*.85,10,0,Math.PI*2); cx.fill(); }
    else if(wep.projType==='heal'){ cx.fillStyle='#98FB98'; cx.beginPath(); cx.arc(0,-wepLen*.85,6,0,Math.PI*2); cx.fill(); }
    else if(wep.projType==='multi'){ cx.fillStyle='#DAA520'; cx.fillRect(-wandWid/2-3,-wepLen*.92,wandWid+6,8); cx.fillStyle='#FFD700'; cx.fillRect(-wandWid/2-1,-wepLen*.94,wandWid+2,4); }
    else if(wep.projType==='star'){
      cx.save(); cx.translate(0,-wepLen*.88); cx.rotate(Math.PI/4);
      cx.fillStyle='#9370DB'; drawStar(cx,0,0,4,6,3); cx.restore();
    } else { cx.beginPath(); cx.arc(0,-wepLen*.85,5,0,Math.PI*2); cx.fill(); }
    cx.globalAlpha=1;
  } else if(wep.id==='w_axe'){
    var axeSwing=Math.sin(prog*.3)*.2;
    cx.rotate(axeSwing);
    cx.fillStyle='#8B4513'; cx.fillRect(-3,-4,6,wepLen*.55);
    cx.fillStyle=wep.c;
    cx.beginPath(); cx.moveTo(-16,wepLen*.35); cx.lineTo(0,wepLen*.15); cx.lineTo(16,wepLen*.35); cx.lineTo(12,wepLen*.45); cx.lineTo(-12,wepLen*.45); cx.closePath(); cx.fill();
    cx.fillStyle='#5C3317'; cx.fillRect(-14,wepLen*.42,28,6);
  } else if(wep.id==='w_hammer'){
    // 雷霆战锤攻击 - 向下绘制
    var hammerSwing=Math.sin(prog*.25)*.15;
    cx.rotate(hammerSwing);
    cx.fillStyle='#696969'; cx.fillRect(-3.5,0,7,wepLen*.5);
    var hw=14, hh=16, hy=wepLen*.52;
    cx.fillStyle='#2F2F2F';
    cx.beginPath(); cx.moveTo(-hw/2-2, hy); cx.lineTo(-hw/2+2, hy+hh); cx.lineTo(hw/2-2, hy+hh); cx.lineTo(hw/2+2, hy); cx.closePath(); cx.fill();
    cx.fillStyle='#4169E1';
    cx.beginPath(); cx.moveTo(-hw/2, hy+2); cx.lineTo(-hw/2+3, hy+hh-2); cx.lineTo(hw/2-3, hy+hh-2); cx.lineTo(hw/2, hy+2); cx.closePath(); cx.fill();
    cx.fillStyle='#6495ED'; cx.fillRect(-hw/2+1, hy+hh-5, hw-2, 3);
  } else if(wep.id==='w_scythe'){
    // 死神镰刀攻击 - 向下绘制
    var scytheSwing=Math.sin(prog*.3)*.25;
    cx.rotate(scytheSwing);
    cx.fillStyle='#4A4A4A'; cx.fillRect(-2.5,0,5,wepLen*.72);
    cx.fillStyle='#DDD';
    cx.beginPath(); cx.moveTo(-18,wepLen*.65); cx.quadraticCurveTo(-6,wepLen+12,0,wepLen+7);
    cx.quadraticCurveTo(6,wepLen+12,18,wepLen*.65); cx.lineTo(0,wepLen); cx.closePath(); cx.fill();
  } else if(wep.id==='w_spear'){
    // 龙骑长矛攻击 - 向下绘制
    cx.fillStyle='#8B6914'; cx.fillRect(-2.5,0,5,wepLen);
    cx.fillStyle='#C0A060';
    cx.beginPath(); cx.moveTo(0,wepLen-5); cx.lineTo(-9,wepLen*.82); cx.lineTo(0,wepLen+5); cx.lineTo(9,wepLen*.82); cx.closePath(); cx.fill();
    cx.fillStyle='#FFD700'; cx.fillRect(-2,wepLen*.85,4,5);
  } else if(wep.id==='w_dual'){
    // 双子匕首攻击 - 向下绘制
    var dualSwing=Math.sin(prog*.6)*.3;
    cx.save(); cx.translate(-T*.15,0); cx.rotate(.25+dualSwing);
    cx.fillStyle='#C0C0C0'; cx.beginPath(); cx.moveTo(0,-2); cx.lineTo(-2.5,wepLen*.32); cx.lineTo(-0.8,wepLen*.42); cx.lineTo(0.8,wepLen*.42); cx.lineTo(2.5,wepLen*.32); cx.closePath(); cx.fill();
    cx.restore();
    cx.save(); cx.translate(T*.15,0); cx.rotate(-.25-dualSwing);
    cx.fillStyle='#C0C0C0'; cx.beginPath(); cx.moveTo(0,-2); cx.lineTo(-2.5,wepLen*.32); cx.lineTo(-0.8,wepLen*.42); cx.lineTo(0.8,wepLen*.42); cx.lineTo(2.5,wepLen*.32); cx.closePath(); cx.fill();
    cx.restore();
  } else if(wep.id==='w_rusty'){
    // 生锈短剑攻击绘制
    // 细长生锈短剑（攻击状态）
    var sw=4;
    var bladeLen=wepLen*.85;
    
    // 剑刃外轮廓
    cx.fillStyle='#3D2D1D';
    cx.fillRect(-sw/2-0.5,-0.5,sw+1,bladeLen+1);
    
    // 剑刃 - 生锈颜色
    var bladeGrad=cx.createLinearGradient(-sw/2,0,sw/2,0);
    bladeGrad.addColorStop(0,'#4A3A2A');
    bladeGrad.addColorStop(0.3,'#6B5B4B');
    bladeGrad.addColorStop(0.5,'#7B6B5B');
    bladeGrad.addColorStop(0.7,'#6B5B4B');
    bladeGrad.addColorStop(1,'#4A3A2A');
    cx.fillStyle=bladeGrad;
    cx.fillRect(-sw/2,0,sw,bladeLen);
    
    // 剑尖
    cx.fillStyle='#7B6B5B';
    cx.beginPath();
    cx.moveTo(-sw/2,bladeLen);
    cx.lineTo(0,bladeLen+10);
    cx.lineTo(sw/2,bladeLen);
    cx.closePath();
    cx.fill();
    
    // 生锈纹理
    cx.fillStyle='rgba(40,30,20,0.4)';
    cx.fillRect(-0.5,6,1,bladeLen*.45);
    
    // 十字护手
    var guardY=wepLen*.03;
    cx.fillStyle='#3D2D1D';
    cx.fillRect(-sw*1.4,guardY-1,sw*2.8,3);
    cx.fillStyle='#5B4B3B';
    cx.fillRect(-sw*1.2,guardY-0.5,sw*2.4,2);
    
    // 剑柄
    var handleH=wepLen*.12;
    cx.fillStyle='#2D1D0D';
    cx.fillRect(-sw*.3,guardY+3,sw*.6,handleH);

/* ===== A*智能寻路系统 ===== */
function findPath(sx,sy,ex,ey,map){
  if(sx<0||sx>=MW||sy<0||sy>=MH||ex<0||ex>=MW||ey<0||ey>=MH) return null;
  if(map.tiles[sy][sx]!==1||map.tiles[ey][ex]!==1) return null;
  var openList=[], closedSet={};
  var startKey=sx+','+sy;
  var nodeMap={};
  nodeMap[startKey]={g:0,h:Math.abs(ex-sx)+Math.abs(ey-sy),f:Math.abs(ex-sx)+Math.abs(ey-sy),x:sx,y:sy,parent:null};
  openList.push(nodeMap[startKey]);
  var iterations=0, maxIter=800;
  while(openList.length>0&&iterations<maxIter){
    iterations++;
    openList.sort(function(a,b){return a.f-b.f;});
    var current=openList.shift();
    var ck=current.x+','+current.y;
    if(current.x===ex&&current.y===ey){
      var path=[];
      var n=current;
      while(n){ path.unshift({x:n.x,y:n.y}); n=n.parent; }
      return path.length>1?path.slice(1):path;
    }
    closedSet[ck]=true;
    var dirs=[[0,-1],[1,0],[0,1],[-1,0]];
    for(var di=0;di<dirs.length;di++){
      var nx=current.x+dirs[di][0], ny=current.y+dirs[di][1];
      if(nx<0||nx>=MW||ny<0||ny>=MH) continue;
      if(map.tiles[ny][nx]!==1) continue;
      var nk=nx+','+ny;
      if(closedSet[nk]) continue;
      var g=current.g+1, h=Math.abs(ex-nx)+Math.abs(ey-ny), f=g+h;
      if(!nodeMap[nk]||g<nodeMap[nk].g){
        var newNode={g:g,h:h,f:f,x:nx,y:ny,parent:current};
        nodeMap[nk]=newNode;
        var inOpen=false;
        for(var oi=0;oi<openList.length;oi++){ if(openList[oi].x===nx&&openList[oi].y===ny){ inOpen=true; break; } }
        if(!inOpen) openList.push(newNode);
      }
    }
  }
  return null;
}

      } else {

function upBoss(m,dt,map,pcx,pcy,d,speedMult){

    var hitWall=false;

/* ===== 碰撞与战斗 ===== */
function isW(x,y,sz,map){
  var mg=T*.15*(sz||1), cks=[[x+mg,y+mg],[x+T-mg,y+mg],[x+mg,y+T-mg],[x+T-mg,y+T-mg]];
  for(var i=0;i<cks.length;i++){
    var tx=Math.floor(cks[i][0]/T), ty=Math.floor(cks[i][1]/T);
    if(tx<0||tx>=MW||ty<0||ty>=MH) return true;
    if(map.tiles[ty][tx]===0) return true;
  }
  return false;
}
function bOv(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function hurtP(dmg){
  if(P.invt>0) return;
  var d2=Math.max(1, dmg-getPdef());
  if(P.shield>0){ P.shield--; d2=0; spFt(P.x+T/2,P.y-20,'🛡护盾','#98FB98',14); }
  P.hp=Math.max(0,P.hp-d2); P.invt=INVT/16.67;
  playSound('hurt'); vib(100);
  if(d2>0) spFt(P.x+T/2,P.y,'-'+d2,'#FF6B6B',18); spPt(P.x+T/2,P.y+T/2,'#FF4444',Math.ceil(6*PF),2,30);

  if(isMultiplayer){
    syncPlayerDamage();
  }

  if(P.hp<=0){
    gs='dead'; document.getElementById('uib').classList.add('hid');
    document.getElementById('dsa').innerHTML='到达第 '+P.fl+' 层 | 等级 '+P.lv+'<br>击杀 '+P.kl+' 个怪物 | 身上金币 '+DB.gold + (isMultiplayer ? '<br><span style="color:#4A90D9">双人合作模式</span>' : '');
    document.getElementById('ds').classList.remove('hid');
  }
}

async function syncPlayerDamage(){
  var mp = window._multiplayer;
  if(!mp.roomId || !mp.db) return;

  try{
    var damageRef = window.fbRef(mp.db, 'dungeon_rooms/' + mp.roomId + '/damage/' + mp.playerId);
    await window.fbSet(damageRef, {
      hp: P.hp,
      timestamp: Date.now()
    });
  }catch(e){}
}

async function syncMonsterDamage(monsterId, damage){
  var mp = window._multiplayer;

    var monRef = window.fbRef(mp.db, 'dungeon_rooms/' + mp.roomId + '/monster_attacks');

function fireProj(px,py,dir,w){
  var sp=6, dx=0, dy=0;
  if(dir==='up') dy=-sp; else if(dir==='down') dy=sp; else if(dir==='right') dx=sp; else dx=-sp;
  var proj = {x:px+T/2, y:py+T/2, dx:dx, dy:dy, atk:getPatk(), l:120, c:w.c, slow:false, poison:false, penetrate:false, fire:false, shadow:false, heal:false, multi:false, star:false};
  if(w.projType==='slow'){ proj.slow=true; proj.c='#5CB8FF'; }
  else if(w.projType==='poison'){ proj.poison=true; proj.c='#4CAF50'; }
  else if(w.projType==='penetrate'){ proj.penetrate=true; proj.c='#FFE082'; }
  else if(w.projType==='fire'){ proj.fire=true; proj.c='#FF6347'; }
  else if(w.projType==='shadow'){ proj.shadow=true; proj.c='#483D8B'; }
  else if(w.projType==='heal'){ proj.heal=true; proj.c='#98FB98'; l=80; }
  else if(w.projType==='multi'){
    proj.multi=true; proj.c='#DAA520';
    var baseAngle = Math.atan2(dy, dx);
    var spreadAngles = [-0.35, 0.35, -0.7];
    for(var mi=0;mi<3;mi++){
      var angle = baseAngle + spreadAngles[mi];
      var mdx = Math.cos(angle) * sp, mdy = Math.sin(angle) * sp;
      projs.push({x:px+T/2, y:py+T/2, dx:mdx, dy:mdy, atk:getPatk()-1, l:100, c:'#DAA520', multi:true});
    }
  }
  else if(w.projType==='star'){ proj.star=true; proj.c='#9370DB'; proj.atk+=1; }
  projs.push(proj);
  playSound('atk');
}

function pAtk(){
  if(P.atkt>0) return;
  var w = WEPS[DB.eqWep];
  var cd = getAtkCd();
  P.atkg=true; P.atkt=cd/16.67; P.atkd=P.dir;
  if(w.tp==='range'){ fireProj(P.x, P.y, P.dir, w); return; }
  playSound('atk');
  var d=P.atkd, px=P.x, py=P.y, ax, ay, abw=T*1.3*w.r;
  if(d==='up'){ax=px-abw/2+T/2;ay=py-abw+T/2;} else if(d==='down'){ax=px-abw/2+T/2;ay=py+T/2;}
  else if(d==='right'){ax=px+T*.5;ay=py-abw/2+T/2;} else{ax=px-abw+T*.5;ay=py-abw/2+T/2;}
  P.atkAb={x:ax,y:ay,w:abw,h:abw};
  P.atkHit=[];
}
function addXP(amt){
  P.xp+=amt;
  while(P.xp>=P.xpn){
    P.xp-=P.xpn; P.lv++; P.xpn=Math.ceil(P.xpn*1.5); P.atk+=1; P.mhp+=2; P.hp=Math.min(P.hp+4,P.mhp);
    playSound('lvlup');
    spFt(P.x+T/2,P.y-25,'升级! Lv.'+P.lv,CC.gd,18); spPt(P.x+T/2,P.y+T/2,CC.gd,Math.ceil(20*PF),3,50);

var gs='start', cMap=null, cam={x:0,y:0}, gs_paused=false, curMapStyle='classic';
var MAP_NAMES = {classic:'🏰 古堡', maze:'🌀 迷宫', cross:'✝ 十字殿', spiral:'🐚 螺旋', cave:'🕳️ 洞窟', arena:'⚔ 竞技场'};
var chkLock = false;

function initFl(floor){
  try {
    cMap = genMap(floor);
    if (!cMap || !cMap.tiles || !cMap.rooms || cMap.rooms.length === 0 || !cMap.sr) {
      console.warn("initFl 检测到无效地图，强制使用经典地图");
      cMap = genClassicMap(floor);
    }
    if (!cMap.str) {
      cMap.str = cMap.rooms[cMap.rooms.length - 1];
    }
    var sr2 = cMap.sr;
    var startX = sr2.cx * T;
    var startY = sr2.cy * T;
    if (startX < 0 || startX >= MW*T || startY < 0 || startY >= MH*T) {
      startX = T*2; startY = T*2;
    }
    P.x = startX; P.y = startY;
    P.fl = floor;
    P.atkg = false;
    P.atkt = 0;
    P.atkAb = null;
    P.atkHit = [];
    P.invt = 0;
    P.spdBoost = 0;
    P.atkBoost = 0;
    P.shield = 0;
    P.shieldT = 0;
    drps = [];
    pts = [];
    fts = [];
    projs = [];

    plMons(cMap.rooms, sr2, cMap.str, floor);
    plChts(cMap.rooms, sr2, cMap.str, floor);

    if (isW(P.x, P.y, 1, cMap)) {
      console.warn("玩家起始位置卡墙，尝试修正");
      for (var dy = -2; dy <= 2; dy++) {
        for (var dx = -2; dx <= 2; dx++) {
          var tx = P.x + dx*T, ty = P.y + dy*T;
          if (!isW(tx, ty, 1, cMap)) {
            P.x = tx; P.y = ty;
            break;
          }
        }
      }
    }

    cam.x = P.x + T/2 - W/2;
    cam.y = P.y + T/2 - H/2;
    cam.x = cl(cam.x, 0, MW*T - W);
    cam.y = cl(cam.y, 0, MH*T - H);
  } catch(e) {
    console.error("initFl 致命错误，再次尝试经典地图", e);
    cMap = genClassicMap(1);
    P.x = cMap.sr.cx * T;
    P.y = cMap.sr.cy * T;
    P.fl = floor || 1;
    drps = []; pts = []; fts = []; projs = [];
    plMons(cMap.rooms, cMap.sr, cMap.str, floor);
    plChts(cMap.rooms, cMap.sr, cMap.str, floor);
    cam.x = P.x + T/2 - W/2;
    cam.y = P.y + T/2 - H/2;
  }
}

function chkCol(){
  if (chkLock) return;
  var ptx=Math.floor((P.x+T/2)/T), pty=Math.floor((P.y+T/2)/T);
  if(ptx>=0&&ptx<MW&&pty>=0&&pty<MH&&cMap.tiles[pty][ptx]===2){
    chkLock = true;
    if(P.fl>=MAX_F){
      gs='win'; document.getElementById('uib').classList.add('hid');
      document.getElementById('wsa').innerHTML='通过全部 '+MAX_F+' 层!<br>等级 '+P.lv+' | 击杀 '+P.kl+' | 金币 '+DB.gold;
      document.getElementById('ws').classList.remove('hid'); saveData();
    } else {
      playSound('coin');
      spPt(P.x+T/2,P.y+T/2,CC.sc,Math.ceil(25*PF),3,40); spFt(P.x+T/2,P.y-10,'进入第 '+(P.fl+1)+' 层',CC.sc,18);
      initFl(P.fl+1); saveData();
    }
    setTimeout(() => { chkLock = false; }, 200);
    return;
  }
  for(var i=0;i<chsts.length;i++){
    var c=chsts[i]; if(c.op) continue;
    if(Math.abs(P.x+T/2-c.x)<T*.6&&Math.abs(P.y+T/2-c.y)<T*.6){
      c.op=true; var ga=ri(15,35)*c.f; DB.gold+=ga; playSound('buy');
      spFt(c.x,c.y-15,'+'+ga,CC.gd,16); spPt(c.x,c.y,CC.gd,Math.ceil(15*PF),2.5,35);
      if(Math.random()<.5){var h=ri(1,3);P.hp=Math.min(P.hp+h,P.mhp);spFt(c.x,c.y-30,'+'+h+'HP',CC.hf,14);}
      saveData();
    }
  }
  for(var i=drps.length-1;i>=0;i--){
    var d=drps[i];
    if(Math.abs(P.x+T/2-d.x)<T*.6&&Math.abs(P.y+T/2-d.y)<T*.6){
      if(d.t==='heart'){P.hp=Math.min(P.hp+2,P.mhp);spFt(d.x,d.y-15,'+2HP',CC.hf,14);spPt(d.x,d.y,CC.hf,Math.ceil(8*PF),2,20); playSound('coin');}
      else if(d.t==='gold'){var a=ri(5,12);DB.gold+=a;spFt(d.x,d.y-15,'+'+a,CC.gd,14);spPt(d.x,d.y,CC.gd,Math.ceil(6*PF),2,18); playSound('coin'); saveData();}
      else if(d.t==='xp'){ spPt(d.x,d.y,CC.xc,Math.ceil(6*PF),2,18); playSound('xp'); }
      else if(d.t==='i_hp1'){ DB.items['i_hp1']=(DB.items['i_hp1']||0)+1; spFt(d.x,d.y-15,'+小红瓶',CC.hf,14); playSound('buy'); saveData(); }
      else if(d.t==='i_bomb'){ DB.items['i_bomb']=(DB.items['i_bomb']||0)+1; spFt(d.x,d.y-15,'+炸弹','#888',14); playSound('buy'); saveData(); }
      drps.splice(i,1);
    }
  }
}

function upPl(dt,map){
  applyJoystick();
  P.spdBoost=Math.max(0,P.spdBoost-dt); P.atkBoost=Math.max(0,P.atkBoost-dt); P.shieldT=Math.max(0,P.shieldT-dt);
  if(P.shieldT<=0) P.shield=0;
  var dx=0, dy=0;
  if(keys['KeyW']||keys['ArrowUp']){dy=-1;} if(keys['KeyS']||keys['ArrowDown']){dy=1;}
  if(keys['KeyA']||keys['ArrowLeft']){dx=-1;} if(keys['KeyD']||keys['ArrowRight']){dx=1;}
  if(dx!==0 || dy!==0){
     if(Math.abs(dx)>Math.abs(dy)) P.dir = dx>0?'right':'left'; else P.dir = dy>0?'down':'up';
  }
  P.mv=dx!==0||dy!==0;
  if(P.mv){
    var l=Math.hypot(dx,dy); dx/=l; dy/=l;
    var spdMult = P.spdBoost>0 ? 1.5 : 1;
    var sp=PSPD*P.pSpd*spdMult*dt, nx=P.x+dx*sp, ny=P.y+dy*sp;
    if(!isW(nx,P.y,1,map)) P.x=nx; if(!isW(P.x,ny,1,map)) P.y=ny; P.wf+=dt;
  }
  if(keys['Space']) pAtk();
  if(P.atkt>0){P.atkt-=dt;if(P.atkt<=0){P.atkg=false;P.atkAb=null;P.atkHit=[];}}
  if(P.atkg && P.atkAb && WEPS[DB.eqWep].tp!=='range'){
    var w = WEPS[DB.eqWep];
    for(var i=0;i<mons.length;i++){
      var m=mons[i]; if(m.hp<=0 || P.atkHit.indexOf(m.id)!==-1) continue;
      var mb={x:m.x,y:m.y,w:T*m.sz,h:T*m.sz};
      if(bOv(P.atkAb,mb)){
        var dmg = Math.max(1, getPatk() + ri(0,2)); m.hp-=dmg; m.ht=15; P.atkHit.push(m.id);
        playSound('hit'); vib(20);
        spFt(m.x+T*m.sz/2,m.y,'-'+dmg,'#FFF',16); spPt(m.x+T*m.sz/2,m.y+T*m.sz/2,MT[m.type].c,Math.ceil(6*PF),2.5,25);
        var a=Math.atan2(m.y+T/2-(P.y+T/2),m.x+T/2-(P.x+T/2)), kb=10*w.r;
        var nx=m.x+Math.cos(a)*kb, ny=m.y+Math.sin(a)*kb;
        if(!isW(nx,m.y,m.sz,cMap)) m.x=nx; if(!isW(m.x,ny,m.sz,cMap)) m.y=ny;
        if(isMultiplayer){ syncMonsterDamage(m.id, dmg); }
        if(m.hp<=0){ P.kl++; spMDrp(m.x,m.y); addXP(m.xp); }
      }
    }
  }
  P.invt=Math.max(0,P.invt-dt);
  chkCol();
}

function upCam(){ var tx=P.x+T/2-W/2, ty=P.y+T/2-H/2; cam.x=lr(cam.x,tx,.1); cam.y=lr(cam.y,ty,.1); cam.x=cl(cam.x,0,MW*T-W); cam.y=cl(cam.y,0,MH*T-H); }

var bgP=[]; for(var i=0;i<30;i++) bgP.push({x:rn(0,window.innerWidth),y:rn(0,window.innerHeight),vx:rn(-.3,.3),vy:rn(-.5,-.1),sz:rn(2,5),a:rn(.1,.4),c:pk(['#FFD700','#C9A96E','#A89478','#8B7355','#E0D0C0'])});

function renderWorld(){
  cx.fillStyle=CC.wd; cx.fillRect(0,0,W,H); if(!cMap) return;
  var ox=cam.x, oy=cam.y; drMap(ox,oy,cMap);
  for(var i=0;i<chsts.length;i++) drCht(chsts[i],ox,oy);
  drDrp(ox,oy);
  var ents=[{tp:'p',y:P.y}]; for(var i=0;i<mons.length;i++) if(mons[i].hp>0) ents.push({tp:'m',d:mons[i],y:mons[i].y});
  if(isMultiplayer && P2) ents.push({tp:'p2',y:P2.y});
  ents.sort((a,b)=>a.y-b.y);
  for(var i=0;i<ents.length;i++){
    if(ents[i].tp==='p') drPl(ox,oy);
    else if(ents[i].tp==='p2') drPl2(ox,oy);
    else drMon(ents[i].d,ox,oy);
  }
  for(var bi=0;bi<mons.length;bi++){
    var bm=mons[bi]; if(bm.type!=='boss' || bm.hp<=0) continue;
    var bpx=Math.floor(bm.x-ox), bpy=Math.floor(bm.y-oy), bs=T*bm.sz, bccx=bpx+T/2;
    var bbw=bs*.9, bbh=4, bbx=bccx-bbw/2, bby=bpy+(T-T*bm.sz)/2-8;
    cx.fillStyle='#300'; cx.fillRect(bbx,bby,bbw,bbh); cx.fillStyle='#E04040'; cx.fillRect(bbx,bby,bbw*(bm.hp/bm.mhp),bbh); cx.strokeStyle='#600'; cx.lineWidth=1; cx.strokeRect(bbx,bby,bbw,bbh);
  }

  for(var i=0;i<projs.length;i++){
    var p=projs[i];
    cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x-ox, p.y-oy, p.penetrate?4:5, 0, Math.PI*2); cx.fill();
    cx.fillStyle='#FFF'; cx.beginPath(); cx.arc(p.x-ox-2, p.y-oy-2, 2, 0, Math.PI*2); cx.fill();
    if(p.penetrate){ cx.strokeStyle='rgba(255,255,200,.7)'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(p.x-ox-p.dx*4, p.y-oy-p.dy*4); cx.lineTo(p.x-ox, p.y-oy); cx.stroke(); }
  }

  var dop = cx.globalAlpha;
  for(var i=0;i<pts.length;i++){var p=pts[i];cx.globalAlpha=cl(p.l/p.ml,0,1);cx.fillStyle=p.c;var s=p.sz*cl(p.l/p.ml,0,1);cx.fillRect(Math.floor(p.x-ox-s/2),Math.floor(p.y-oy-s/2),Math.ceil(s),Math.ceil(s));}
  for(var i=0;i<fts.length;i++){var f=fts[i];cx.globalAlpha=cl(f.l/f.ml,0,1);cx.fillStyle=f.c;cx.font='bold '+f.s+'px Georgia';cx.textAlign='center';cx.fillText(f.t,Math.floor(f.x-ox),Math.floor(f.y-oy));}
  cx.globalAlpha=dop;

  drLight(ox,oy); drHUD(); drMM(cMap); drTouch();
}

var lt=0;
function loop(ts){

    cx.fillStyle='#1E1825'; cx.fillRect(0,0,W,H);

      cx.globalAlpha=p.a; cx.fillStyle=p.c; cx.fillRect(Math.floor(p.x),Math.floor(p.y),p.sz,p.sz);
    }
    cx.globalAlpha=1;
  } else if(gs==='playing'){
    if(!gs_paused){
      if(!cMap || !cMap.tiles || !cMap.rooms) {
        console.warn("检测到cMap损坏，自动重建第"+P.fl+"层");

}

/* ===== 快速测试：遍历楼层定位卡死问题 ===== */
window.autoTestFloors = function() {
  var totalOk = 0, totalFail = 0;
  var originalGs = gs, originalCMap = cMap, originalP = P ? {x:P.x,y:P.y,fl:P.fl} : null;
  console.log('========== 楼层地图生成测试开始 ==========');
  for(var f = 1; f <= MAX_F; f++) {
    var style = getMapStyle(f);
    var result = null, err = null;
    try {
      result = genMap(f);
      if (!result) throw new Error('genMap 返回 null');
      if (!result.tiles) throw new Error('无 tiles');
      if (!result.rooms || result.rooms.length === 0) throw new Error('rooms 为空');
      if (!result.sr) throw new Error('无 sr (起点房间)');
      if (typeof result.sr.cx !== 'number' || typeof result.sr.cy !== 'number') throw new Error('sr 缺少 cx/cy, sr='+JSON.stringify(result.sr));
      if (!result.str) result.str = result.rooms[result.rooms.length - 1];
      if (typeof result.str.cx !== 'number' || typeof result.str.cy !== 'number') throw new Error('str 缺少 cx/cy, str='+JSON.stringify(result.str));
      if (result.tiles[result.str.cy] === undefined || result.tiles[result.str.cy][result.str.cx] === undefined) throw new Error('楼梯坐标越界');
      if (result.tiles[result.str.cy][result.str.cx] !== 2) result.tiles[result.str.cy][result.str.cx] = 2;
      if (result.sr.cx < 0 || result.sr.cx >= MW || result.sr.cy < 0 || result.sr.cy >= MH) throw new Error('sr 坐标越界');
      if (result.sr.cx < 0 || result.sr.cx >= MW || result.sr.cy < 0 || result.sr.cy >= MH) throw new Error('sr 坐标越界');
      console.log('  ✅ 第'+f+'层 ['+MAP_NAMES[style]+'] 房间数='+result.rooms.length+' sr=('+result.sr.cx+','+result.sr.cy+') str=('+result.str.cx+','+result.str.cy+')');
      totalOk++;
    } catch(e) {
      console.error('  ❌ 第'+f+'层 ['+style+'] 失败: '+e.message);
      totalFail++;
    }
  }
  console.log('========== 测试完毕: 成功 '+totalOk+' / '+MAX_F+', 失败 '+totalFail+' ==========');
  if (totalFail > 0) {
    console.warn('⚠️ 发现 '+totalFail+' 个有问题的楼层，自动尝试修复中...');
  } else {
    console.log('🎉 所有楼层地图生成正常!');
  }
  return {ok: totalOk, fail: totalFail};
};

/* ===== 一键遍历所有楼层（实际进入游戏切换） ===== */
window.quickTravelAllFloors = function() {
  if (gs !== 'playing' || !cMap) {
    console.warn('请先开始游戏！');
    return;
  }
  var targetFloor = 1;
  var startTime = Date.now();
  console.log('开始快速遍历楼层...');
  
  // 暂停游戏循环，避免寻路计算导致卡顿
  var wasPaused = gs_paused;
  gs_paused = true;
  
  function travelNext() {
    if (targetFloor > MAX_F) {
      gs_paused = wasPaused;
      var elapsed = Date.now() - startTime;
      console.log('🎉 所有楼层遍历完成！耗时 ' + elapsed + 'ms');
      return;
    }
    try {
      console.log('--- 正在生成第 '+targetFloor+' 层 ['+MAP_NAMES[getMapStyle(targetFloor)]+'] ---');
      initFl(targetFloor);
      if (!cMap || !cMap.tiles || !cMap.rooms) {
        console.error('❌ 第 '+targetFloor+' 层: cMap 无效!');
        targetFloor++;
        setTimeout(travelNext, 200);
        return;
      }
      if (cMap.sr && typeof cMap.sr.cx === 'number') {
        P.x = cMap.sr.cx * T;
        P.y = cMap.sr.cy * T;
      }
      console.log('  ✅ 第 '+targetFloor+' 层 OK, 房间='+cMap.rooms.length+' 怪物='+(mons?mons.length:0));
      targetFloor++;
      setTimeout(travelNext, 300);
    } catch(e) {
      console.error('❌ 第 '+targetFloor+' 层 崩溃: '+e.message);
      console.error(e.stack);
      targetFloor++;
      setTimeout(travelNext, 300);
    }
  }
  travelNext();
};
</script>
